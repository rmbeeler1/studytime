<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aviation Unit 4: Aerodynamics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9eef2; --surface:#ffffff; --ink:#15222c; --muted:#56656f; --line:#c9d3da; --soft:#dfe6eb;
  --s-forces:#1d5fa8; --s-lift-theory:#7a3eb1; --s-airfoils:#0e7c6b; --s-lift-factors:#b0306a;
  --s-stalls:#c2410c; --s-weight-and-balance:#4d7c0f; --s-propellers:#9a5b06; --s-drag:#475569;
  --again:#b42318; --hard:#9a5b06; --good:#1d5fa8; --easy:#0e7c6b;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1a22; --surface:#172530; --ink:#e4ebf0; --muted:#9aabb7; --line:#2c3d4a; --soft:#22323e;
  --s-forces:#7fb2ec; --s-lift-theory:#c4a1ea; --s-airfoils:#5fd0bc; --s-lift-factors:#f08cbc;
  --s-stalls:#fb9a6c; --s-weight-and-balance:#a8d46a; --s-propellers:#e8b45c; --s-drag:#a8b6c8;
  --again:#f2867c; --hard:#e8b45c; --good:#7fb2ec; --easy:#5fd0bc; color-scheme: dark; }}
:root[data-theme="dark"]{
  --bg:#0f1a22; --surface:#172530; --ink:#e4ebf0; --muted:#9aabb7; --line:#2c3d4a; --soft:#22323e;
  --s-forces:#7fb2ec; --s-lift-theory:#c4a1ea; --s-airfoils:#5fd0bc; --s-lift-factors:#f08cbc;
  --s-stalls:#fb9a6c; --s-weight-and-balance:#a8d46a; --s-propellers:#e8b45c; --s-drag:#a8b6c8;
  --again:#f2867c; --hard:#e8b45c; --good:#7fb2ec; --easy:#5fd0bc; color-scheme: dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",-apple-system,"Segoe UI",Roboto,sans-serif;font-size:19px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--good);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1,h2,.cond{font-family:"Barlow Condensed","Barlow",sans-serif}
h1{font-size:2.4rem;line-height:1.05;margin:.4em 0 .15em;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 1.2em}
.hub{color:var(--muted);font-size:.85em;text-decoration:none;border-bottom:1px solid var(--line)}
/* home */
.launch{background:var(--surface);border-radius:18px;padding:22px 20px;border:1px solid var(--line)}
.due{display:flex;align-items:baseline;gap:.4em;flex-wrap:wrap}
.due b{font-family:"Barlow Condensed";font-size:3.4rem;line-height:1;font-weight:700}
.modes{display:flex;gap:8px;margin:16px 0}
.mode{flex:1;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:transparent;text-align:start;line-height:1.3}
.mode small{display:block;color:var(--muted);font-size:.78em}
.mode[aria-pressed="true"]{border-color:var(--ink);background:var(--soft)}
.go{width:100%;padding:14px;border-radius:12px;border:0;background:var(--ink);color:var(--surface);font-weight:600;font-size:1.05em}
.go:disabled{opacity:.4;cursor:default}
.secs{margin-top:22px}
.secs h2{font-size:1.35rem;margin:0 0 8px;font-weight:600}
.sec{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;width:100%;padding:10px 4px;background:none;border:0;border-bottom:1px solid var(--line);text-align:start}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--c);display:grid;place-items:center}
.sec[aria-pressed="true"] .chk{background:var(--c)}
.sec[aria-pressed="true"] .chk::after{content:"";width:9px;height:5px;border:2.5px solid var(--surface);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.bar{grid-column:2/4;height:7px;border-radius:4px;background:var(--soft);overflow:hidden;display:flex;margin-top:-4px}
.bar i{display:block;height:100%}
.secname{font-weight:500}
.secmeta{color:var(--muted);font-size:.8em;white-space:nowrap}
.legend{display:flex;gap:14px;color:var(--muted);font-size:.78em;margin-top:10px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--sw)}
.foot{display:flex;justify-content:space-between;margin-top:22px;color:var(--muted);font-size:.85em}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0}
/* study */
.top{display:flex;align-items:center;gap:12px}
.back{background:none;border:0;padding:6px 0;color:var(--muted)}
.track{flex:1;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.track i{display:block;height:100%;background:var(--ink);transition:width .3s}
.count{color:var(--muted);font-size:.85em;min-width:3.5em;text-align:end}
.card{--c:var(--ink);margin-top:16px;background:var(--surface);border-radius:18px;border:1px solid var(--line);border-top:6px solid var(--c);padding:18px 20px 22px;min-height:360px;display:flex;flex-direction:column}
.chip{display:flex;align-items:center;gap:8px;color:var(--c);font-weight:600;font-size:.85em}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip .add{color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;font-weight:500;font-size:.9em}
.prompt{font-size:1.32em;font-weight:600;line-height:1.35;margin:.5em 0 .2em}
.list{display:inline-block;text-align:start}
.cz{color:var(--c);font-weight:700}
.cz.gap{display:inline-block;min-width:3.2em;padding:0 .35em;border-radius:6px;background:color-mix(in srgb,var(--c) 14%,transparent);border-bottom:2.5px solid var(--c);text-align:center;font-weight:600}
.viz{margin:12px 0 4px}
.viz svg{width:100%;height:auto;max-height:46vh;display:block}
.answer{border-top:1.5px solid var(--line);margin-top:16px;padding-top:14px}
.ans{font-size:1.32em;font-weight:600;color:var(--c)}
.extra{color:var(--muted);font-size:.9em;margin-top:.5em}
.spacer{flex:1}
.reveal{margin-top:18px;width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--ink);background:transparent;font-weight:600}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.g{padding:10px 4px;border-radius:12px;border:0;background:var(--soft);font-weight:600;line-height:1.2;border-bottom:3px solid var(--gc)}
.g small{display:block;font-weight:400;color:var(--muted);font-size:.72em;margin-top:2px}
.keys{color:var(--muted);font-size:.75em;text-align:center;margin-top:10px}
.done{text-align:center;padding:40px 10px}
.done h1{font-size:2.6rem}
@media (hover:none){.keys{display:none}}
@media (max-width:420px){body{font-size:18px}.card{padding:16px 14px 18px}.due b{font-size:3rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fadein{animation:fi .22s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
svg text{font-family:"Barlow Condensed","Barlow",sans-serif;font-weight:600}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const DATA = {"cards": [{"id": "b0", "sec": "Forces", "kind": "basic", "front": "In steady flight, the sum of all upward force components equals what?", "back": "The sum of all downward force components", "extra": "Not just lift versus weight. Every force has components, and all the up components balance all the down components.", "added": false, "viz": "forces", "vf": false}, {"id": "b1", "sec": "Forces", "kind": "basic", "front": "In steady flight, the sum of all forward force components equals what?", "back": "The sum of all backward force components", "extra": "Not just thrust versus drag.", "added": false, "viz": "forces", "vf": false}, {"id": "b2", "sec": "Forces", "kind": "basic", "front": "Which force does lift overcome?", "back": "Weight", "extra": "", "added": false, "viz": "forces:Weight", "vf": false}, {"id": "b3", "sec": "Forces", "kind": "basic", "front": "Which part of the airplane creates lift?", "back": "The wings", "extra": "", "added": false, "viz": "parts:Wing", "vf": false}, {"id": "b4", "sec": "Forces", "kind": "basic", "front": "Lift acts in which direction relative to the relative wind?", "back": "Perpendicular to it", "extra": "Relative wind is the airflow the wing meets; lift points at 90\u00b0 to it.", "added": false, "viz": "forces:Lift", "vf": false}, {"id": "b5", "sec": "Forces", "kind": "basic", "front": "In straight-and-level flight at constant airspeed, lift equals which force?", "back": "Weight", "extra": "Balanced flight.", "added": false, "viz": "forces:Weight", "vf": false}, {"id": "b6", "sec": "Forces", "kind": "basic", "front": "In straight-and-level flight at constant airspeed, thrust equals which force?", "back": "Drag", "extra": "Balanced flight.", "added": false, "viz": "forces:Drag", "vf": false}, {"id": "b7", "sec": "Forces", "kind": "basic", "front": "When all forces are balanced, what happens to airspeed and altitude?", "back": "Neither changes", "extra": "This is why balanced flight is straight, level and at constant airspeed.", "added": false, "viz": "forces", "vf": false}, {"id": "b8", "sec": "Forces", "kind": "basic", "front": "Balanced flight (no change in speed or altitude) illustrates which of Newton's laws?", "back": "Newton's first law (inertia)", "extra": "An object keeps its motion unless an unbalanced force acts on it. The slide asks this as a discussion question.", "added": true, "viz": "forces", "vf": false}, {"id": "b9", "sec": "Lift Theory", "kind": "basic", "front": "Which lift theory do the slides label false (NO!)?", "back": "Longer path (equal transit time) theory", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b10", "sec": "Lift Theory", "kind": "basic", "front": "Equal transit time theory claims air over the wing's top must do what?", "back": "Travel faster to meet lower air at the trailing edge", "extra": "The theory uses this to explain low pressure on top.", "added": false, "viz": "", "vf": false}, {"id": "b11", "sec": "Lift Theory", "kind": "basic", "front": "What false assumption is equal transit time theory built on?", "back": "Air splitting at the leading edge must rejoin together", "extra": "Molecules arriving at the leading edge at the same time do NOT have to reach the trailing edge at the same time.", "added": false, "viz": "", "vf": false}, {"id": "b12", "sec": "Lift Theory", "kind": "basic", "front": "On an airfoil, which edge is the front?", "back": "The leading edge", "extra": "The back is the trailing edge.", "added": false, "viz": "airfoil:leading edge", "vf": false}, {"id": "b13", "sec": "Lift Factors", "kind": "basic", "front": "What is the symbol for angle of attack?", "back": "\u03b1 (alpha)", "extra": "Also written AOA.", "added": false, "viz": "airfoil:angle of attack", "vf": false}, {"id": "b14", "sec": "Lift Factors", "kind": "basic", "front": "How does a pilot change the angle of attack?", "back": "By pitching the airplane up or down", "extra": "", "added": false, "viz": "airfoil:angle of attack", "vf": false}, {"id": "b15", "sec": "Lift Factors", "kind": "basic", "front": "Why does a higher angle of attack create more lift?", "back": "It forces more airflow downward", "extra": "", "added": false, "viz": "airfoil:angle of attack", "vf": false}, {"id": "b16", "sec": "Lift Factors", "kind": "basic", "front": "An aircraft's airspeed is measured relative to what?", "back": "The air it is moving through", "extra": "Not relative to the ground.", "added": false, "viz": "airfoil:relative wind", "vf": false}, {"id": "b17", "sec": "Lift Factors", "kind": "basic", "front": "Why do higher airspeeds produce more lift?", "back": "The airfoil contacts more air molecules", "extra": "", "added": false, "viz": "airfoil:relative wind", "vf": false}, {"id": "b18", "sec": "Lift Factors", "kind": "basic", "front": "Aircraft usually generate their own relative wind by creating which force?", "back": "Thrust", "extra": "Not always: a strong wind alone can create enough lift to make an aircraft fly.", "added": false, "viz": "airfoil:relative wind", "vf": false}, {"id": "b19", "sec": "Lift Factors", "kind": "basic", "front": "What does camber refer to on an airfoil?", "back": "Its curvature", "extra": "", "added": false, "viz": "camber", "vf": false}, {"id": "b20", "sec": "Lift Factors", "kind": "basic", "front": "How does a more curved camber line change lift?", "back": "Lift increases", "extra": "", "added": false, "viz": "camber", "vf": false}, {"id": "b21", "sec": "Lift Factors", "kind": "basic", "front": "What is the only way a pilot can change wing camber?", "back": "Extending or retracting flaps", "extra": "Flaps are lift-enhancing devices. Flaps down = more camber.", "added": false, "viz": "camber", "vf": false}, {"id": "b22", "sec": "Lift Factors", "kind": "basic", "front": "How can pilots change the camber of the horizontal and vertical stabilizers?", "back": "By moving the elevator and rudder", "extra": "Deflecting a control surface curves the stabilizer's airfoil, changing its lift. The slide asks this as a discussion question.", "added": true, "viz": "parts:Horizontal stabilizer", "vf": false}, {"id": "b23", "sec": "Lift Factors", "kind": "basic", "front": "Doubling wing surface area does what to lift?", "back": "Doubles it", "extra": "Area has a linear effect.", "added": false, "viz": "parts:Wing", "vf": false}, {"id": "b24", "sec": "Lift Factors", "kind": "basic", "front": "Which lift factor can a pilot generally NOT control?", "back": "Wing surface area", "extra": "Pilots control AOA, airspeed and (with flaps) camber.", "added": false, "viz": "", "vf": false}, {"id": "b25", "sec": "Lift Factors", "kind": "basic", "front": "Doubling an aircraft's velocity does what to lift?", "back": "Quadruples it (4\u00d7)", "extra": "Velocity's effect is exponential, not linear.", "added": false, "viz": "curve:lift", "vf": false}, {"id": "b26", "sec": "Lift Factors", "kind": "basic", "front": "A change in airspeed changes which value in the lift equation?", "back": "Velocity", "extra": "", "added": false, "viz": "curve:lift", "vf": false}, {"id": "b27", "sec": "Stalls", "kind": "basic", "front": "As angle of attack increases, what happens to the coefficient of lift?", "back": "It increases, until the critical AOA", "extra": "", "added": false, "viz": "liftcurve", "vf": false}, {"id": "b28", "sec": "Stalls", "kind": "basic", "front": "What happens when a wing exceeds its critical angle of attack?", "back": "The wing stalls", "extra": "Airflow separates from the top of the wing and lift drops.", "added": false, "viz": "liftcurve", "vf": false}, {"id": "b29", "sec": "Stalls", "kind": "basic", "front": "For a given airplane and configuration, a stall always occurs at the same what?", "back": "Angle of attack", "extra": "Stalls can still happen at different airspeeds.", "added": false, "viz": "liftcurve", "vf": false}, {"id": "b30", "sec": "Stalls", "kind": "basic", "front": "What sets the stall angle of attack for a given configuration?", "back": "The aircraft's design", "extra": "Configuration means things like flap setting.", "added": false, "viz": "liftcurve", "vf": false}, {"id": "b31", "sec": "Stalls", "kind": "basic", "front": "A normal stall occurs at what load factor?", "back": "1G", "extra": "The same force you feel sitting in your chair.", "added": false, "viz": "", "vf": false}, {"id": "b32", "sec": "Stalls", "kind": "basic", "front": "An accelerated stall occurs at what load factor?", "back": "More than 1G", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b33", "sec": "Stalls", "kind": "basic", "front": "Compared to a normal stall, an accelerated stall happens at what airspeed?", "back": "A higher airspeed", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b34", "sec": "Stalls", "kind": "basic", "front": "With wing washout, which part of the wing should stall first?", "back": "The wing root (inboard section)", "extra": "The tip stalls last.", "added": false, "viz": "washout", "vf": false}, {"id": "b35", "sec": "Stalls", "kind": "basic", "front": "Washout keeps which control surfaces effective after part of the wing stalls?", "back": "The ailerons", "extra": "It also warns the pilot the whole wing is about to stall.", "added": false, "viz": "washout", "vf": false}, {"id": "b36", "sec": "Stalls", "kind": "basic", "front": "With washout, how does wingtip AOA compare to wing root AOA?", "back": "Tip AOA is lower", "extra": "The wing is twisted so the tip stalls last.", "added": false, "viz": "washout", "vf": false}, {"id": "b37", "sec": "Weight and Balance", "kind": "basic", "front": "What is another name for the center of lift?", "back": "Center of pressure", "extra": "", "added": false, "viz": "cg", "vf": false}, {"id": "b38", "sec": "Weight and Balance", "kind": "basic", "front": "What is the center of lift?", "back": "The point where lift forces are concentrated", "extra": "", "added": false, "viz": "cg", "vf": false}, {"id": "b39", "sec": "Weight and Balance", "kind": "basic", "front": "For balance, where is the center of lift relative to the CG?", "back": "Slightly aft (behind) the CG", "extra": "", "added": false, "viz": "cg", "vf": false}, {"id": "b40", "sec": "Weight and Balance", "kind": "basic", "front": "What is the datum?", "back": "The point all arm measurements are taken from", "extra": "Also called the reference datum.", "added": false, "viz": "lever:solved", "vf": false}, {"id": "b41", "sec": "Weight and Balance", "kind": "basic", "front": "Who chooses the location of the datum?", "back": "The aircraft manufacturer", "extra": "It is an arbitrary point.", "added": false, "viz": "lever:solved", "vf": false}, {"id": "b42", "sec": "Weight and Balance", "kind": "basic", "front": "In a balanced aircraft, positive plus negative moments at the CG equal what?", "back": "Zero", "extra": "", "added": false, "viz": "lever:solved", "vf": false}, {"id": "b43", "sec": "Weight and Balance", "kind": "basic", "front": "How do you find the moment of a weight?", "back": "Multiply its arm by its weight", "extra": "Arm is measured in inches from the datum.", "added": false, "viz": "lever:solved", "vf": false}, {"id": "b44", "sec": "Weight and Balance", "kind": "basic", "front": "Find the CG: 100 at +50, 100 at +90, 200 at +150 (inches).", "back": "+110 inches from the datum", "extra": "Moments: 5,000 + 9,000 + 30,000 = 44,000. Total weight 400. 44,000 \u00f7 400 = 110.", "added": false, "viz": "lever", "vf": true, "vizBack": "lever:solved"}, {"id": "b45", "sec": "Weight and Balance", "kind": "basic", "front": "What is the danger of a CG too far forward?", "back": "Not enough elevator nose-up force to flare for landing", "extra": "", "added": false, "viz": "cg:fwd", "vf": false}, {"id": "b46", "sec": "Weight and Balance", "kind": "basic", "front": "What is the danger of a CG too far aft?", "back": "Not enough nose-down force for stall recovery", "extra": "Especially at low airspeed.", "added": false, "viz": "cg:aft", "vf": false}, {"id": "b47", "sec": "Weight and Balance", "kind": "basic", "front": "How does a pilot correct an out-of-limit CG?", "back": "Shift or remove weight", "extra": "", "added": false, "viz": "cg", "vf": false}, {"id": "b48", "sec": "Propellers", "kind": "basic", "front": "A clockwise-spinning propeller causes what reaction from the airplane?", "back": "A counterclockwise reaction", "extra": "", "added": false, "viz": "torque", "vf": false}, {"id": "b49", "sec": "Propellers", "kind": "basic", "front": "Torque reaction gives the airplane which turning tendency?", "back": "Left-turning", "extra": "", "added": false, "viz": "torque", "vf": false}, {"id": "b50", "sec": "Propellers", "kind": "basic", "front": "Torque reaction is an example of which of Newton's laws?", "back": "Newton's third law", "extra": "Engine torque is the action; the left gear forced downward is the reaction.", "added": false, "viz": "forces", "vf": false}, {"id": "b51", "sec": "Propellers", "kind": "basic", "front": "When is torque reaction most prominent?", "back": "Low speed with high power, like takeoff", "extra": "", "added": false, "viz": "torque", "vf": false}, {"id": "b52", "sec": "Propellers", "kind": "basic", "front": "Why does torque effect lessen at higher airspeeds?", "back": "Airflow over control surfaces counters it", "extra": "", "added": false, "viz": "airfoil:relative wind", "vf": false}, {"id": "b53", "sec": "Propellers", "kind": "basic", "front": "Why does a lower power setting reduce torque effect?", "back": "The propeller spins slower", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b54", "sec": "Propellers", "kind": "basic", "front": "Why change a propeller's blade angle during flight?", "back": "To keep the most efficient AOA at any speed", "extra": "Blade angle is the propeller's pitch.", "added": false, "viz": "", "vf": false}, {"id": "b55", "sec": "Propellers", "kind": "basic", "front": "What is the most common type of variable-pitch propeller?", "back": "Constant-speed propeller", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b56", "sec": "Propellers", "kind": "basic", "front": "For takeoff, the pilot sets which propeller pitch?", "back": "Low pitch (high rpm)", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b57", "sec": "Propellers", "kind": "basic", "front": "For cruise, the pilot sets which propeller pitch?", "back": "High pitch (low rpm)", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b58", "sec": "Propellers", "kind": "basic", "front": "What does a variable-pitch propeller use to adjust its blades?", "back": "Oil pressure from the engine", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b59", "sec": "Propellers", "kind": "basic", "front": "Where is the propeller control in the cockpit?", "back": "A knob or lever next to the throttle", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b60", "sec": "Drag", "kind": "basic", "front": "What creates skin friction drag?", "back": "Air resistance moving across the airplane's surface", "extra": "The skin catches air particles and tries to pull the air along.", "added": false, "viz": "", "vf": false}, {"id": "b61", "sec": "Drag", "kind": "basic", "front": "Why does even a smooth surface create skin friction drag?", "back": "It is rough at the microscopic level", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b62", "sec": "Drag", "kind": "basic", "front": "Parasite drag varies in proportion to what?", "back": "The square of the airspeed", "extra": "", "added": false, "viz": "curve:drag", "vf": false}, {"id": "b63", "sec": "Drag", "kind": "basic", "front": "Parasite drag at 160 knots is how many times that at 80 knots?", "back": "4 times", "extra": "Double the airspeed, square the effect: 2\u00b2 = 4.", "added": false, "viz": "curve:drag", "vf": false}, {"id": "b64", "sec": "Drag", "kind": "basic", "front": "What is the L/D ratio?", "back": "Lift produced divided by drag created", "extra": "", "added": false, "viz": "", " function viz(spec, extra={}){ if(!spec) return ""; const [k,arg]=spec.split(":");
  const o = Object.assign({}, extra); if(arg){ if(k==="curve"||k==="lever"||k==="cg") o.hl=arg; else if(!o.quiz) o.hl=arg; }
  return D[k] ? `<div class="viz">${D[k](o)}</div>` : ""; }

/* ---------- scheduling ---------- */
function isDue(c){ const s=st(c.id); return s.due<=Date.now(); }
function pool(){ return CARDS.filter(c=>store.secs.includes(c.sec)); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function buildQueue(){ let p = pool(); if(store.mode==="due") p=p.filter(isDue);
  const seen=p.filter(c=>st(c.id).seen), fresh=p.filter(c=>!st(c.id).seen);
  shuffle(seen); shuffle(fresh); return store.mode==="due" ? seen.concat(fresh.slice(0,30)) : shuffle(p.slice()); }
function preview(c,g){ const s=st(c.id);
  if(g===1) return "again soon"; if(g===2) return "later this session";
  const b=Math.min(6,(s.box||0)+(g===3?1:2)); const d=INTERVALS[b]; return d===1?"1 day":d+" days"; }
function grade(c,g){ const s=Object.assign({},st(c.id)); s.seen=(s.seen||0)+1;
  if(g===1){ s.box=0; s.due=0; } else if(g===2){ s.box=Math.max(1,s.box||0); s.due=Date.now()+DAY*0.5; }
  else { s.box=Math.min(6,(s.box||0)+(g===3?1:2)); s.due=Date.now()+DAY*INTERVALS[s.box]-36e5; }
  store.cards[c.id]=s; save(); return s; }

/* ---------- views ---------- */
const app = document.getElementById("app");
let S = null; // session
function mastery(sec){ const cs=CARDS.filter(c=>c.sec===sec); let m=0,l=0;
  cs.forEach(c=>{const b=st(c.id).box||0, seen=st(c.id).seen; if(b>=3)m++; else if(seen)l++;}); return {n:cs.length,m,l}; }
function home(){ S=null;
  const dueN = pool().filter(isDue).length, totalSel=pool().length;
  const startN = store.mode==="due" ? Math.min(dueN, pool().filter(c=>isDue(c)&&st(c.id).seen).length + Math.min(30,pool().filter(c=>!st(c.id).seen).length)) : totalSel;
  app.innerHTML = `<a class="hub" href="../../">All decks</a><h1>Aviation Unit 4: Aerodynamics</h1><p class="sub">Forces, lift, stalls, weight and balance, propellers and drag.</p>
  <div class="launch"><div class="due"><b>${startN}</b><span>${store.mode==="due"?"cards ready to study":"cards in this review"}</span></div>
   <div class="modes">
    <button class="mode" data-mode="due" aria-pressed="${store.mode==="due"}">Daily study<small>Due cards plus up to 30 new</small></button>
    <button class="mode" data-mode="cram" aria-pressed="${store.mode==="cram"}">Test prep<small>Every selected card, shuffled</small></button>
   </div>
   <button class="go" id="go" ${startN?"":"disabled"}>${startN?"Start studying":"Nothing due. Switch to test prep."}</button></div>
  <div class="secs"><h2>Sections</h2>${SECS.map(s=>{const m=mastery(s);return `
   <button class="sec" style="--c:${cvar(s)}" data-sec="${s}" aria-pressed="${store.secs.includes(s)}">
    <span class="chk"></span><span class="secname">${s}</span><span class="secmeta">${m.m} of ${m.n} solid</span>
    <span class="bar"><i style="width:${m.m/m.n*100}%;background:${cvar(s)}"></i><i style="width:${m.l/m.n*100}%;background:color-mix(in srgb,${cvar(s)} 35%,transparent)"></i></span>
   </button>`}).join("")}
   <div class="legend"><span style="--sw:var(--ink)">Solid: answered right 3 times running</span><span style="--sw:color-mix(in srgb,var(--ink) 35%,transparent)">Learning</span></div></div>
  <div class="foot"><span>${CARDS.length} cards. Progress saves on this device.</span><button class="link" id="reset">Reset progress</button></div>`;
  app.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{store.mode=b.dataset.mode;save();home();});
  app.querySelectorAll(".sec").forEach(b=>b.onclick=()=>{const s=b.dataset.sec; store.secs=store.secs.includes(s)?store.secs.filter(x=>x!==s):store.secs.concat(s); save(); home();});
  document.getElementById("go").onclick=start;
  document.getElementById("reset").onclick=()=>{ if(confirm("Erase all progress on this device?")){store.cards={};save();home();} };
}
function start(){ const q=buildQueue(); if(!q.length) return; S={q, i:0, total:q.length, done:0, flipped:false, right:0, requeued:{}}; card(); }
function head(){ return `<div class="top"><button class="back" id="quit">Done</button><div class="track"><i style="width:${S.done/S.total*100}%"></i></div><span class="count">${S.q.length} left</span></div>`; }
function card(){
  if(!S.q.length) return finish();
  const c=S.q[0], f=S.flipped, quiz=c.kind==="diagram"?{quiz:c.quiz,hideAll:!f}:{};
  const frontViz = c.vf ? viz(c.viz, c.kind==="diagram"&&!f?{quiz:c.quiz,hideAll:true}:{}) : "";
  const backViz = f ? (c.kind==="diagram" ? viz(c.viz,{hl:c.quiz}) : (c.vizBack? viz(c.vizBack) : (c.vf?"":viz(c.viz)))) : "";
  app.innerHTML = head()+`<article class="card fadein" style="--c:${cvar(c.sec)}">
   <div class="chip"><span class="dot"></span>${c.sec}${c.added?'<span class="add">Beyond the slides</span>':""}</div>
   <div class="prompt">${f&&c.kind==="cloze"?c.back:c.front}</div>
   ${(c.kind==="diagram"||c.vizBack)&&f?"":frontViz}
   ${f?`<div class="answer">${c.kind==="cloze"?"":`<div class="ans">${c.back}</div>`}${backViz}${c.extra?`<div class="extra">${c.extra}</div>`:""}</div>`:""}
   <div class="spacer"></div>
   ${f?`<div class="grades">${["Again","Hard","Good","Easy"].map((n,k)=>`<button class="g" data-g="${k+1}" style="--gc:var(--${n.toLowerCase()})">${n}<small>${preview(c,k+1)}</small></button>`).join("")}</div>
     <div class="keys">Keys 1 to 4 to grade</div>`
   :`<button class="reveal" id="flip">Show answer</button><div class="keys">Space to show the answer</div>`}
  </article>`;
  document.getElementById("quit").onclick=home;
  if(f) app.querySelectorAll(".g").forEach(b=>b.onclick=()=>answer(+b.dataset.g));
  else document.getElementById("flip").onclick=()=>{S.flipped=true;card();};
}
function answer(g){ const c=S.q.shift(); grade(c,g); S.flipped=false;
  if(g===1){ S.q.splice(Math.min(3,S.q.length),0,c); }
  else if(g===2 && !S.requeued[c.id]){ S.requeued[c.id]=1; S.q.splice(Math.min(8,S.q.length),0,c); }
  else { S.done++; if(g>=3) S.right++; }
  if(S.done>S.total) S.total=S.done;
  card(); }
function finish(){ app.innerHTML=`<div class="done fadein"><h1>Session complete</h1>
  <p class="sub">${S.total} cards cleared. ${S.right} answered Good or Easy on the way out.</p>
  <button class="go" id="h">Back to sections</button></div>`; document.getElementById("h").onclick=home; }
document.addEventListener("keydown",e=>{ if(!S||!S.q.length||e.metaKey||e.ctrlKey) return;
  if(!S.flipped && (e.key===" "||e.key==="Enter")){ e.preventDefault(); S.flipped=true; card(); }
  else if(S.flipped && /^[1-4]$/.test(e.key)) answer(+e.key); });
home();
</script>
