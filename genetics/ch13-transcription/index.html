<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Genetics Ch 13: Transcription</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9eef2; --surface:#ffffff; --ink:#15222c; --muted:#56656f; --line:#c9d3da; --soft:#dfe6eb;
  --s-rna-structure:#1d5fa8; --s-rna-classes:#7a3eb1; --s-transcription-basics:#0e7c6b; --s-consensus-sequences:#b0306a; --s-bacterial-initiation:#c2410c; --s-bacterial-termination:#9a5b06; --s-eukaryotic-initiation:#4d7c0f; --s-eukaryotic-termination:#475569; 
  --again:#b42318; --hard:#9a5b06; --good:#1d5fa8; --easy:#0e7c6b;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1a22; --surface:#172530; --ink:#e4ebf0; --muted:#9aabb7; --line:#2c3d4a; --soft:#22323e;
  --s-rna-structure:#7fb2ec; --s-rna-classes:#c4a1ea; --s-transcription-basics:#5fd0bc; --s-consensus-sequences:#f08cbc; --s-bacterial-initiation:#fb9a6c; --s-bacterial-termination:#e8b45c; --s-eukaryotic-initiation:#a8d46a; --s-eukaryotic-termination:#a8b6c8; 
  --again:#f2867c; --hard:#e8b45c; --good:#7fb2ec; --easy:#5fd0bc; color-scheme: dark; }}
:root[data-theme="dark"]{
  --bg:#0f1a22; --surface:#172530; --ink:#e4ebf0; --muted:#9aabb7; --line:#2c3d4a; --soft:#22323e;
  --s-rna-structure:#7fb2ec; --s-rna-classes:#c4a1ea; --s-transcription-basics:#5fd0bc; --s-consensus-sequences:#f08cbc; --s-bacterial-initiation:#fb9a6c; --s-bacterial-termination:#e8b45c; --s-eukaryotic-initiation:#a8d46a; --s-eukaryotic-termination:#a8b6c8; 
  --again:#f2867c; --hard:#e8b45c; --good:#7fb2ec; --easy:#5fd0bc; color-scheme: dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",-apple-system,"Segoe UI",Roboto,sans-serif;font-size:19px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--good);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1,h2,.cond{font-family:"Barlow Condensed","Barlow",sans-serif}
h1{font-size:2.4rem;line-height:1.05;margin:.4em 0 .15em;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 1.2em}
.hub{color:var(--muted);font-size:.85em;text-decoration:none;border-bottom:1px solid var(--line)}
/* home */
.launch{background:var(--surface);border-radius:18px;padding:22px 20px;border:1px solid var(--line)}
.due{display:flex;align-items:baseline;gap:.4em;flex-wrap:wrap}
.due b{font-family:"Barlow Condensed";font-size:3.4rem;line-height:1;font-weight:700}
.modes{display:flex;gap:8px;margin:16px 0}
.mode{flex:1;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:transparent;text-align:start;line-height:1.3}
.mode small{display:block;color:var(--muted);font-size:.78em}
.mode[aria-pressed="true"]{border-color:var(--ink);background:var(--soft)}
.go{width:100%;padding:14px;border-radius:12px;border:0;background:var(--ink);color:var(--surface);font-weight:600;font-size:1.05em}
.go:disabled{opacity:.4;cursor:default}
.secs{margin-top:22px}
.secs h2{font-size:1.35rem;margin:0 0 8px;font-weight:600}
.sec{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;width:100%;padding:10px 4px;background:none;border:0;border-bottom:1px solid var(--line);text-align:start}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--c);display:grid;place-items:center}
.sec[aria-pressed="true"] .chk{background:var(--c)}
.sec[aria-pressed="true"] .chk::after{content:"";width:9px;height:5px;border:2.5px solid var(--surface);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.bar{grid-column:2/4;height:7px;border-radius:4px;background:var(--soft);overflow:hidden;display:flex;margin-top:-4px}
.bar i{display:block;height:100%}
.secname{font-weight:500}
.secmeta{color:var(--muted);font-size:.8em;white-space:nowrap}
.legend{display:flex;gap:14px;color:var(--muted);font-size:.78em;margin-top:10px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--sw)}
.foot{display:flex;justify-content:space-between;margin-top:22px;color:var(--muted);font-size:.85em}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0}
/* study */
.top{display:flex;align-items:center;gap:12px}
.back{background:none;border:0;padding:6px 0;color:var(--muted)}
.track{flex:1;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.track i{display:block;height:100%;background:var(--ink);transition:width .3s}
.count{color:var(--muted);font-size:.85em;min-width:3.5em;text-align:end}
.card{--c:var(--ink);margin-top:16px;background:var(--surface);border-radius:18px;border:1px solid var(--line);border-top:6px solid var(--c);padding:18px 20px 22px;min-height:360px;display:flex;flex-direction:column}
.chip{display:flex;align-items:center;gap:8px;color:var(--c);font-weight:600;font-size:.85em}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip .add{color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;font-weight:500;font-size:.9em}
.prompt{font-size:1.32em;font-weight:600;line-height:1.35;margin:.5em 0 .2em}
.list{display:inline-block;text-align:start}
.cz{color:var(--c);font-weight:700}
.cz.gap{display:inline-block;min-width:3.2em;padding:0 .35em;border-radius:6px;background:color-mix(in srgb,var(--c) 14%,transparent);border-bottom:2.5px solid var(--c);text-align:center;font-weight:600}
.viz{margin:12px 0 4px}
.viz svg{width:100%;height:auto;max-height:46vh;display:block}
.answer{border-top:1.5px solid var(--line);margin-top:16px;padding-top:14px}
.ans{font-size:1.32em;font-weight:600;color:var(--c)}
.extra{color:var(--muted);font-size:.9em;margin-top:.5em}
.spacer{flex:1}
.reveal{margin-top:18px;width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--ink);background:transparent;font-weight:600}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.g{padding:10px 4px;border-radius:12px;border:0;background:var(--soft);font-weight:600;line-height:1.2;border-bottom:3px solid var(--gc)}
.g small{display:block;font-weight:400;color:var(--muted);font-size:.72em;margin-top:2px}
.keys{color:var(--muted);font-size:.75em;text-align:center;margin-top:10px}
.done{text-align:center;padding:40px 10px}
.done h1{font-size:2.6rem}
@media (hover:none){.keys{display:none}}
@media (max-width:420px){body{font-size:18px}.card{padding:16px 14px 18px}.due b{font-size:3rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fadein{animation:fi .22s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
svg text{font-family:"Barlow Condensed","Barlow",sans-serif;font-weight:600}
.mode{min-width:0}
.go.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line);margin-top:10px}
.resume{background:var(--surface);border:1.5px solid var(--ink);border-radius:18px;padding:18px 20px;margin-bottom:14px;display:grid;gap:10px}
.resume b{display:block;font-family:"Barlow Condensed";font-size:1.5rem;line-height:1.1}
.resume span{color:var(--muted);font-size:.9em}
.resume .link{justify-self:center;font-size:.85em}
.legend .nosw::before{display:none}
.chip .score{margin-left:auto;color:var(--muted);font-weight:500;white-space:nowrap}
.chip .score small{font-size:.85em}
.result{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;margin:18px 0;text-align:start}
.big{display:flex;align-items:center;gap:14px}
.big b{font-family:"Barlow Condensed";font-size:3.4rem;line-height:1}
.big span{color:var(--muted);font-size:.9em;line-height:1.3}
.gbar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:16px 0 8px;background:var(--soft)}
.glegend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.8em}
.glegend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--sw)}
.bysec{margin-top:14px}
.bs{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line)}
.bs .bar{grid-column:1/3;margin-top:2px}
.done .go{margin-top:10px}
@media (max-width:420px){.modes{gap:6px}.mode{padding:9px 8px;font-size:.9em}.chip{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const DATA = {"cards": [{"id": "b0", "sec": "RNA Structure", "kind": "basic", "front": "Which sugar is found in RNA?", "back": "Ribose", "extra": "DNA uses deoxyribose.", "added": false, "viz": "sugar", "vf": false}, {"id": "b1", "sec": "RNA Structure", "kind": "basic", "front": "What does ribose have at its 2\u2032 carbon that deoxyribose lacks?", "back": "An OH (hydroxyl) group", "extra": "Deoxyribose has just an H at the 2\u2032 carbon.", "added": false, "viz": "sugar", "vf": false}, {"id": "b2", "sec": "RNA Structure", "kind": "basic", "front": "Why is RNA less stable than DNA?", "back": "Ribose's 2\u2032 OH is chemically more reactive", "extra": "RNA is easily degraded; DNA is stable.", "added": false, "viz": "sugar", "vf": false}, {"id": "b3", "sec": "RNA Structure", "kind": "basic", "front": "Which base is found in RNA but not in DNA?", "back": "Uracil (U)", "extra": "", "added": false, "viz": "bases:U", "vf": false}, {"id": "b4", "sec": "RNA Structure", "kind": "basic", "front": "Which base is found in DNA but not in RNA?", "back": "Thymine (T)", "extra": "", "added": false, "viz": "bases:T", "vf": false}, {"id": "b5", "sec": "RNA Structure", "kind": "basic", "front": "How many rings does a purine base have?", "back": "Two", "extra": "Purines: A and G.", "added": false, "viz": "bases:purine", "vf": false}, {"id": "b6", "sec": "RNA Structure", "kind": "basic", "front": "How many rings does a pyrimidine base have?", "back": "One", "extra": "Pyrimidines: C, T and U.", "added": false, "viz": "bases:pyrimidine", "vf": false}, {"id": "b7", "sec": "RNA Structure", "kind": "basic", "front": "What type of bond joins RNA nucleotides together?", "back": "Phosphodiester bonds", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b8", "sec": "RNA Structure", "kind": "basic", "front": "The RNA backbone alternates between which two components?", "back": "Phosphate groups and ribose sugars", "extra": "Note the 5\u2032 to 3\u2032 direction of the strand.", "added": false, "viz": "", "vf": false}, {"id": "b9", "sec": "RNA Structure", "kind": "basic", "front": "Is RNA usually single- or double-stranded?", "back": "Usually single-stranded", "extra": "DNA is usually double-stranded.", "added": false, "viz": "", "vf": false}, {"id": "b10", "sec": "RNA Structure", "kind": "basic", "front": "What is DNA's secondary structure?", "back": "A double helix", "extra": "RNA can take many types of secondary structure.", "added": false, "viz": "", "vf": false}, {"id": "b11", "sec": "RNA Structure", "kind": "basic", "front": "What creates RNA secondary structure?", "back": "Intramolecular base pairing", "extra": "The strand folds back and pairs with itself.", "added": false, "viz": "hairpin", "vf": false}, {"id": "b12", "sec": "RNA Structure", "kind": "basic", "front": "What determines an RNA's secondary structure?", "back": "Its base sequence", "extra": "Different RNAs can assume different structures.", "added": false, "viz": "hairpin", "vf": false}, {"id": "b13", "sec": "RNA Structure", "kind": "basic", "front": "In RNA intramolecular base pairing, adenine pairs with what?", "back": "Uracil (A-U)", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b14", "sec": "RNA Structure", "kind": "basic", "front": "In RNA intramolecular base pairing, guanine pairs with what?", "back": "Cytosine (G-C)", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b15", "sec": "RNA Structure", "kind": "basic", "front": "What does RNA secondary structure provide?", "back": "Function", "extra": "Secondary structure provides function!", "added": false, "viz": "", "vf": false}, {"id": "b16", "sec": "RNA Classes", "kind": "basic", "front": "Which class of RNA encodes proteins?", "back": "Messenger RNA (mRNA)", "extra": "Found in the nucleus and cytoplasm.", "added": false, "viz": "", "vf": false}, {"id": "b17", "sec": "RNA Classes", "kind": "basic", "front": "Which RNA acts as an adaptor between mRNA and amino acids?", "back": "Transfer RNA (tRNA)", "extra": "Helps incorporate amino acids into the polypeptide chain. Covered in Chapter 15.", "added": false, "viz": "", "vf": false}, {"id": "b18", "sec": "RNA Classes", "kind": "basic", "front": "Which RNA forms the structural and functional parts of the ribosome?", "back": "Ribosomal RNA (rRNA)", "extra": "Covered in Chapter 14.", "added": false, "viz": "", "vf": false}, {"id": "b19", "sec": "RNA Classes", "kind": "basic", "front": "What does small nuclear RNA (snRNA) do?", "back": "Processes pre-mRNA", "extra": "Eukaryotic, nucleus.", "added": false, "viz": "", "vf": false}, {"id": "b20", "sec": "RNA Classes", "kind": "basic", "front": "What does small nucleolar RNA (snoRNA) do?", "back": "Processes and assembles rRNA", "extra": "Eukaryotic, nucleus.", "added": false, "viz": "", "vf": false}, {"id": "b21", "sec": "RNA Classes", "kind": "basic", "front": "What does microRNA (miRNA) do?", "back": "Inhibits translation of mRNA", "extra": "Eukaryotic, nucleus and cytoplasm.", "added": false, "viz": "", "vf": false}, {"id": "b22", "sec": "RNA Classes", "kind": "basic", "front": "What does small interfering RNA (siRNA) do?", "back": "Triggers degradation of other RNA molecules", "extra": "Eukaryotic, nucleus and cytoplasm.", "added": false, "viz": "", "vf": false}, {"id": "b23", "sec": "RNA Classes", "kind": "basic", "front": "What does Piwi-interacting RNA (piRNA) do?", "back": "Suppresses transposable elements in reproductive cells", "extra": "It suppresses their transcription.", "added": false, "viz": "", "vf": false}, {"id": "b24", "sec": "RNA Classes", "kind": "basic", "front": "What does CRISPR RNA (crRNA) do?", "back": "Assists destruction of foreign DNA", "extra": "Prokaryotic only.", "added": false, "viz": "", "vf": false}, {"id": "b25", "sec": "RNA Classes", "kind": "basic", "front": "What does long noncoding RNA (lncRNA) do?", "back": "A variety of functions", "extra": "Eukaryotic, nucleus and cytoplasm.", "added": false, "viz": "", "vf": false}, {"id": "b26", "sec": "RNA Classes", "kind": "basic", "front": "Which RNA class in Table 13.2 is found only in prokaryotes?", "back": "CRISPR RNA (crRNA)", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b27", "sec": "RNA Classes", "kind": "basic", "front": "Where are all eukaryotic RNAs synthesized?", "back": "In the nucleus", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b28", "sec": "Transcription Basics", "kind": "basic", "front": "In the flow of genetic information, DNA is transcribed into what?", "back": "RNA", "extra": "RNA is then translated into protein.", "added": false, "viz": "flow", "vf": false}, {"id": "b29", "sec": "Transcription Basics", "kind": "basic", "front": "Which enzyme carries out transcription?", "back": "RNA polymerase", "extra": "DNA replication uses DNA polymerase.", "added": false, "viz": "", "vf": false}, {"id": "b30", "sec": "Transcription Basics", "kind": "basic", "front": "DNA replication uses both strands as template. Transcription uses how many?", "back": "One (the template strand)", "extra": "", "added": false, "viz": "template", "vf": false}, {"id": "b31", "sec": "Transcription Basics", "kind": "basic", "front": "What primer does transcription require?", "back": "None", "extra": "DNA replication needs a primer; transcription does not.", "added": false, "viz": "", "vf": false}, {"id": "b32", "sec": "Transcription Basics", "kind": "basic", "front": "In transcription, adenine in the DNA template pairs with what?", "back": "Uracil (U)", "extra": "No thymine in RNA.", "added": false, "viz": "", "vf": false}, {"id": "b33", "sec": "Transcription Basics", "kind": "basic", "front": "What is the final product of transcription?", "back": "A single-stranded RNA molecule", "extra": "Such as mRNA. Replication makes two identical dsDNA molecules.", "added": false, "viz": "", "vf": false}, {"id": "b34", "sec": "Transcription Basics", "kind": "basic", "front": "In what direction is RNA synthesized?", "back": "5\u2032 to 3\u2032", "extra": "Same direction as DNA replication.", "added": false, "viz": "template", "vf": false}, {"id": "b35", "sec": "Transcription Basics", "kind": "basic", "front": "To which end of the RNA are new nucleotides always added?", "back": "The 3\u2032 end", "extra": "", "added": false, "viz": "template", "vf": false}, {"id": "b36", "sec": "Transcription Basics", "kind": "basic", "front": "Which DNA strand has the same sequence as the RNA?", "back": "The nontemplate strand (T instead of U)", "extra": "It is not transcribed.", "added": false, "viz": "template:nontemplate", "vf": false}, {"id": "b37", "sec": "Transcription Basics", "kind": "basic", "front": "The template strand relates to the RNA how?", "back": "Complementary and antiparallel", "extra": "", "added": false, "viz": "template:template", "vf": false}, {"id": "b38", "sec": "Transcription Basics", "kind": "basic", "front": "Which DNA strand can serve as a gene's template?", "back": "Either strand", "extra": "Whichever is used, the RNA is always antiparallel to it.", "added": false, "viz": "template", "vf": false}, {"id": "b39", "sec": "Transcription Basics", "kind": "basic", "front": "What is the promoter?", "back": "DNA just upstream of the start site", "extra": "Where the transcription apparatus binds.", "added": false, "viz": "gene:Promoter", "vf": false}, {"id": "b40", "sec": "Transcription Basics", "kind": "basic", "front": "Which part of a gene serves as the template for RNA synthesis?", "back": "The RNA-coding region", "extra": "", "added": false, "viz": "gene:RNA-coding region", "vf": false}, {"id": "b41", "sec": "Transcription Basics", "kind": "basic", "front": "What is the terminator?", "back": "DNA sequence that causes transcription to stop", "extra": "Usually part of the RNA.", "added": false, "viz": "gene:Terminator", "vf": false}, {"id": "b42", "sec": "Transcription Basics", "kind": "basic", "front": "Is the promoter upstream or downstream of the start site?", "back": "Upstream", "extra": "", "added": false, "viz": "gene:Promoter", "vf": false}, {"id": "b43", "sec": "Transcription Basics", "kind": "basic", "front": "Which is NOT a promoter function: bind apparatus, set start, pick strand, end?", "back": "Signaling where transcription ends", "extra": "Concept Check 1. That is the terminator's job.", "added": false, "viz": "gene:Terminator", "vf": false}, {"id": "b44", "sec": "Transcription Basics", "kind": "basic", "front": "Template DNA is 5\u2032-AGGCTAG-3\u2032. What is the RNA?", "back": "3\u2032-UCCGAUC-5\u2032", "extra": "Complementary and antiparallel. Read 5\u2032 to 3\u2032 it is 5\u2032-CUAGCCU-3\u2032.", "added": false, "viz": "", "vf": false}, {"id": "b45", "sec": "Transcription Basics", "kind": "basic", "front": "What determines where and how transcription is initiated?", "back": "Gene structure, especially the promoter", "extra": "", "added": false, "viz": "gene:Promoter", "vf": false}, {"id": "b46", "sec": "Consensus Sequences", "kind": "basic", "front": "What is a consensus sequence?", "back": "The most common nucleotides at a specific location", "extra": "In DNA or RNA.", "added": false, "viz": "consensus", "vf": false}, {"id": "b47", "sec": "Consensus Sequences", "kind": "basic", "front": "In a consensus sequence, what does R stand for?", "back": "A purine (A or G)", "extra": "", "added": false, "viz": "consensus", "vf": false}, {"id": "b48", "sec": "Consensus Sequences", "kind": "basic", "front": "In a consensus sequence, what does Y stand for?", "back": "A pyrimidine (C, T or U)", "extra": "", "added": false, "viz": "consensus", "vf": false}, {"id": "b49", "sec": "Consensus Sequences", "kind": "basic", "front": "In a consensus sequence, what does N stand for?", "back": "Any nucleotide", "extra": "N = all.", "added": false, "viz": "consensus", "vf": false}, {"id": "b50", "sec": "Consensus Sequences", "kind": "basic", "front": "Building a consensus, what rule do you apply first?", "back": "Go by majority", "extra": "Then use R or Y when a position is split within one group.", "added": false, "viz": "consensus", "vf": false}, {"id": "b51", "sec": "Consensus Sequences", "kind": "basic", "front": "A position is split between C and G. How is it written?", "back": "C/G", "extra": "Split between the two groups, so list both.", "added": false, "viz": "consensus", "vf": false}, {"id": "b52", "sec": "Consensus Sequences", "kind": "basic", "front": "Position reads T, C, T, C across four sequences. Consensus letter?", "back": "Y", "extra": "T and C are both pyrimidines.", "added": false, "viz": "consensus", "vf": false}, {"id": "b53", "sec": "Consensus Sequences", "kind": "basic", "front": "Position reads A, A, G, G across four sequences. Consensus letter?", "back": "R", "extra": "A and G are both purines.", "added": false, "viz": "consensus", "vf": false}, {"id": "b54", "sec": "Consensus Sequences", "kind": "basic", "front": "Position reads A, T, C, G across four sequences. Consensus letter?", "back": "N", "extra": "No majority and no single group.", "added": false, "viz": "consensus", "vf": false}, {"id": "b55", "sec": "Consensus Sequences", "kind": "basic", "front": "Consensus of TATAAAAG, TCCAATGC, AATAGCCG, TACAGGAC?", "back": "5\u2032-TAYARNA(C/G)-3\u2032", "extra": "Position by position: T, A, Y, A, R, N, A, C/G.", "added": false, "viz": "consensus:solved", "vf": false}, {"id": "b56", "sec": "Bacterial Initiation", "kind": "basic", "front": "How many subunits make up the bacterial core RNA polymerase?", "back": "Five", "extra": "2 \u03b1, \u03b2, \u03b2\u2032 and \u03c9.", "added": false, "viz": "polymerase", "vf": false}, {"id": "b57", "sec": "Bacterial Initiation", "kind": "basic", "front": "What does the bacterial core enzyme do?", "back": "Synthesizes RNA", "extra": "", "added": false, "viz": "polymerase", "vf": false}, {"id": "b58", "sec": "Bacterial Initiation", "kind": "basic", "front": "What does the sigma (\u03c3) factor do?", "back": "Guides core enzyme to promoters to start transcription", "extra": "", "added": false, "viz": "polymerase:sigma", "vf": false}, {"id": "b59", "sec": "Bacterial Initiation", "kind": "basic", "front": "What is the holoenzyme?", "back": "Core enzyme plus sigma factor", "extra": "The form that initially binds the promoter.", "added": false, "viz": "polymerase:holo", "vf": false}, {"id": "b60", "sec": "Bacterial Initiation", "kind": "basic", "front": "Which form of bacterial RNA polymerase first binds the promoter?", "back": "The holoenzyme", "extra": "", "added": false, "viz": "polymerase:holo", "vf": false}, {"id": "b61", "sec": "Bacterial Initiation", "kind": "basic", "front": "What is the bacterial \u221210 consensus sequence?", "back": "TATAAT", "extra": "10 bp upstream of the start site.", "added": false, "viz": "bprom", "vf": false}, {"id": "b62", "sec": "Bacterial Initiation", "kind": "basic", "front": "What is the bacterial \u221235 consensus sequence?", "back": "TTGACA", "extra": "35 bp upstream of the start site.", "added": false, "viz": "bprom", "vf": false}, {"id": "b63", "sec": "Bacterial Initiation", "kind": "basic", "front": "The \u221210 sequence sits how far from the start site?", "back": "10 bp upstream", "extra": "", "added": false, "viz": "bprom", "vf": false}, {"id": "b64", "sec": "Bacterial Initiation", "kind": "basic", "front": "What number is given to the transcription start site?", "back": "+1", "extra": "", "added": false, "viz": "bprom", "vf": false}, {"id": "b65", "sec": "Bacterial Initiation", "kind": "basic", "front": "What binds the \u221210 consensus sequence in most bacterial promoters?", "back": "The holoenzyme (core enzyme + sigma)", "extra": "Concept Check 2.", "added": false, "viz": "bprom", "vf": false}, {"id": "b66", "sec": "Bacterial Initiation", "kind": "basic", "front": "After binding, how does the holoenzyme form the transcription bubble?", "back": "Changes conformation and unwinds the DNA", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b67", "sec": "Bacterial Initiation", "kind": "basic", "front": "What determines the first RNA nucleotide?", "back": "It is complementary to the template at the start site", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b68", "sec": "Bacterial Initiation", "kind": "basic", "front": "How many phosphates are cleaved from each subsequent rNTP?", "back": "Two", "extra": "Leaves one phosphate in the phosphodiester bond.", "added": false, "viz": "", "vf": false}, {"id": "b69", "sec": "Bacterial Initiation", "kind": "basic", "front": "How many phosphate groups does the first rNTP keep?", "back": "All three", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b70", "sec": "Bacterial Initiation", "kind": "basic", "front": "When is the sigma factor released?", "back": "As RNA polymerase moves beyond the promoter", "extra": "Now just the core enzyme continues.", "added": false, "viz": "polymerase", "vf": false}, {"id": "b71", "sec": "Bacterial Termination", "kind": "basic", "front": "During elongation, which form of RNA polymerase moves downstream?", "back": "The core enzyme", "extra": "Sigma is already released.", "added": false, "viz": "", "vf": false}, {"id": "b72", "sec": "Bacterial Termination", "kind": "basic", "front": "About how many base pairs are unwound in the transcription bubble?", "back": "About 18 bp", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b73", "sec": "Bacterial Termination", "kind": "basic", "front": "What can cause RNA polymerase to pause?", "back": "Certain DNA sequences or RNA secondary structures", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b74", "sec": "Bacterial Termination", "kind": "basic", "front": "After adding a wrong nucleotide, what does RNA polymerase do?", "back": "Pauses, backs up, cuts the last few nucleotides", "extra": "Then it continues transcribing.", "added": false, "viz": "", "vf": false}, {"id": "b75", "sec": "Bacterial Termination", "kind": "basic", "front": "What does rut stand for in a rut site?", "back": "Rho utilization", "extra": "It is in the RNA sequence.", "added": false, "viz": "rho", "vf": false}, {"id": "b76", "sec": "Bacterial Termination", "kind": "basic", "front": "Where does rho bind?", "back": "The rut site on the RNA", "extra": "", "added": false, "viz": "rho", "vf": false}, {"id": "b77", "sec": "Bacterial Termination", "kind": "basic", "front": "In which direction does rho move along the RNA?", "back": "5\u2032 to 3\u2032", "extra": "Toward the paused RNA polymerase.", "added": false, "viz": "rho", "vf": false}, {"id": "b78", "sec": "Bacterial Termination", "kind": "basic", "front": "Which rho activity ends transcription?", "back": "Helicase activity", "extra": "It unwinds the RNA-DNA hybrid and releases the RNA.", "added": false, "viz": "rho", "vf": false}, {"id": "b79", "sec": "Bacterial Termination", "kind": "basic", "front": "What requirement defines rho-independent termination?", "back": "No additional protein factors", "extra": "It is an intrinsic process.", "added": false, "viz": "hairpin", "vf": false}, {"id": "b80", "sec": "Bacterial Termination", "kind": "basic", "front": "What follows the inverted repeat in a rho-independent terminator?", "back": "About six adenine nucleotides", "extra": "Transcribed as a string of U's in the RNA.", "added": false, "viz": "hairpin", "vf": false}, {"id": "b81", "sec": "Bacterial Termination", "kind": "basic", "front": "Inverted repeats in the RNA fold into what?", "back": "A hairpin", "extra": "By intramolecular base pairing.", "added": false, "viz": "hairpin", "vf": false}, {"id": "b82", "sec": "Bacterial Termination", "kind": "basic", "front": "In rho-independent termination, why does the RNA separate from the DNA?", "back": "U-A base pairs are weak", "extra": "The string of U's destabilizes the DNA-RNA pairing.", "added": false, "viz": "hairpin", "vf": false}, {"id": "b83", "sec": "Eukaryotic Initiation", "kind": "basic", "front": "Which eukaryotic RNA polymerase transcribes large rRNAs?", "back": "RNA polymerase I", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b84", "sec": "Eukaryotic Initiation", "kind": "basic", "front": "Which eukaryotic RNA polymerase transcribes pre-mRNA?", "back": "RNA polymerase II", "extra": "Also some snRNAs, snoRNAs and some miRNAs.", "added": false, "viz": "", "vf": false}, {"id": "b85", "sec": "Eukaryotic Initiation", "kind": "basic", "front": "Which eukaryotic RNA polymerase transcribes tRNAs?", "back": "RNA polymerase III", "extra": "Also small rRNAs, some snRNAs and some miRNAs.", "added": false, "viz": "", "vf": false}, {"id": "b86", "sec": "Eukaryotic Initiation", "kind": "basic", "front": "Which RNA polymerase, found in plants, transcribes some siRNAs?", "back": "RNA polymerase IV", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b87", "sec": "Eukaryotic Initiation", "kind": "basic", "front": "Which plant RNA polymerase makes RNAs for heterochromatin formation?", "back": "RNA polymerase V", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b88", "sec": "Eukaryotic Initiation", "kind": "basic", "front": "What makes up the basal transcription apparatus?", "back": "RNA polymerase plus general transcription factors", "extra": "", "added": false, "viz": "eprom", "vf": false}, {"id": "b89", "sec": "Eukaryotic Initiation", "kind": "basic", "front": "What are transcription factors?", "back": "Proteins that bind DNA and affect transcription levels", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b90", "sec": "Eukaryotic Initiation", "kind": "basic", "front": "In a Pol II core promoter, what are the conserved sequences?", "back": "Binding sites for general transcription factors", "extra": "", "added": false, "viz": "eprom", "vf": false}, {"id": "b91", "sec": "Eukaryotic Initiation", "kind": "basic", "front": "What is the TATA box sequence?", "back": "TATAAA", "extra": "At about \u221225.", "added": false, "viz": "eprom", "vf": false}, {"id": "b92", "sec": "Eukaryotic Initiation", "kind": "basic", "front": "Which general transcription factor binds the TATA box first?", "back": "TFIID", "extra": "Step 1 of preinitiation complex assembly.", "added": false, "viz": "eprom", "vf": false}, {"id": "b93", "sec": "Eukaryotic Initiation", "kind": "basic", "front": "What does TBP stand for?", "back": "TATA-binding protein", "extra": "A subunit of TFIID.", "added": false, "viz": "", "vf": false}, {"id": "b94", "sec": "Eukaryotic Initiation", "kind": "basic", "front": "TBP binds which groove of the DNA?", "back": "The minor groove", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b95", "sec": "Eukaryotic Initiation", "kind": "basic", "front": "What does TBP binding do to the DNA?", "back": "Bends and partly unwinds it", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b96", "sec": "Eukaryotic Initiation", "kind": "basic", "front": "Proteins bound to distant enhancers reach the basal apparatus how?", "back": "The DNA loops out", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b97", "sec": "Eukaryotic Initiation", "kind": "basic", "front": "Regulatory promoter transcription factors interact with the basal apparatus through what?", "back": "The mediator", "extra": "", "added": false, "viz": "", "vf": false}, {"id": "b98", "sec": "Eukaryotic Initiation", "kind": "basic", "front": "After initiation, what stays at the promoter?", "back": "The basal transcription factors", "extra": "RNA Pol II moves downstream.", "added": false, "viz": "", "vf": false}, {"id": "b99", "sec": "Eukaryotic Initiation", "kind": "basic", "front": "Where on RNA Pol II are nucleotides added to the 3\u2032 end?", "back": "The active site", "extra": "Entering DNA is gripped and unwound into the bubble first.", "added": false, "viz": "", "vf": false}, {"id": "b100", "sec": "Eukaryotic Termination", "kind": "basic", "front": "How does RNA polymerase I terminate transcription?", "back": "It requires a termination factor", "extra": "Similar to rho in bacteria.", "added": false, "viz": "", "vf": false}, {"id": "b101", "sec": "Eukaryotic Termination", "kind": "basic", "front": "How does RNA polymerase III terminate transcription?", "back": "It transcribes a terminator sequence", "extra": "Similar to rho-independent termination in bacteria.", "added": false, "viz": "", "vf": false}, {"id": "b102", "sec": "Eukaryotic Termination", "kind": "basic", "front": "Which mechanism terminates RNA polymerase II transcription?", "back": "The Rat1 exonuclease mechanism", "extra": "Not at specific sequences.", "added": false, "viz": "rat1", "vf": false}, {"id": "b103", "sec": "Eukaryotic Termination", "kind": "basic", "front": "What kind of enzyme is Rat1?", "back": "A 5\u2032 to 3\u2032 exonuclease", "extra": "", "added": false, "viz": "rat1", "vf": false}, {"id": "b104", "sec": "Eukaryotic Termination", "kind": "basic", "front": "How is the 3\u2032 end of a Pol II RNA generated?", "back": "The RNA is cleaved", "extra": "Pol II keeps transcribing past the cleavage site.", "added": false, "viz": "rat1", "vf": false}, {"id": "b105", "sec": "Eukaryotic Termination", "kind": "basic", "front": "Where does Rat1 bind?", "back": "The 5\u2032 end of the trailing RNA", "extra": "The RNA left after the cleavage site.", "added": false, "viz": "rat1", "vf": false}, {"id": "b106", "sec": "Eukaryotic Termination", "kind": "basic", "front": "When does Rat1-mediated termination occur?", "back": "When Rat1 reaches RNA Pol II", "extra": "It degrades the RNA as it goes.", "added": false, "viz": "rat1", "vf": false}, {"id": "c0_1", "sec": "RNA Structure", "kind": "cloze", "front": "A nucleotide is made of a <span class=\"cz gap\">?</span>, a sugar and a base.", "back": "A nucleotide is made of a <span class=\"cz\">phosphate</span>, a sugar and a base.", "extra": "", "added": false, "viz": "nucleotide", "vf": false}, {"id": "c0_2", "sec": "RNA Structure", "kind": "cloze", "front": "A nucleotide is made of a phosphate, a <span class=\"cz gap\">?</span> and a base.", "back": "A nucleotide is made of a phosphate, a <span class=\"cz\">sugar</span> and a base.", "extra": "", "added": false, "viz": "nucleotide", "vf": false}, {"id": "c0_3", "sec": "RNA Structure", "kind": "cloze", "front": "A nucleotide is made of a phosphate, a sugar and a <span class=\"cz gap\">?</span>.", "back": "A nucleotide is made of a phosphate, a sugar and a <span class=\"cz\">base</span>.", "extra": "", "added": false, "viz": "nucleotide", "vf": false}, {"id": "c1_1", "sec": "RNA Structure", "kind": "cloze", "front": "<div class=\"list\">Bases shared by DNA and RNA:<br><span class=\"cz gap\">?</span><br>Guanine<br>Cytosine</div>", "back": "<div class=\"list\">Bases shared by DNA and RNA:<br><span class=\"cz\">Adenine</span><br>Guanine<br>Cytosine</div>", "extra": "T is DNA-only; U is RNA-only.", "added": false, "viz": "bases", "vf": false}, {"id": "c1_2", "sec": "RNA Structure", "kind": "cloze", "front": "<div class=\"list\">Bases shared by DNA and RNA:<br>Adenine<br><span class=\"cz gap\">?</span><br>Cytosine</div>", "back": "<div class=\"list\">Bases shared by DNA and RNA:<br>Adenine<br><span class=\"cz\">Guanine</span><br>Cytosine</div>", "extra": "T is DNA-only; U is RNA-only.", "added": false, "viz": "bases", "vf": false}, {"id": "c1_3", "sec": "RNA Structure", "kind": "cloze", "front": "<div class=\"list\">Bases shared by DNA and RNA:<br>Adenine<br>Guanine<br><span class=\"cz gap\">?</span></div>", "back": "<div class=\"list\">Bases shared by DNA and RNA:<br>Adenine<br>Guanine<br><span class=\"cz\">Cytosine</span></div>", "extra": "T is DNA-only; U is RNA-only.", "added": false, "viz": "bases", "vf": false}, {"id": "c2_1", "sec": "RNA Structure", "kind": "cloze", "front": "Purines: <span class=\"cz gap\">?</span> and guanine", "back": "Purines: <span class=\"cz\">adenine</span> and guanine", "extra": "Mnemonic: pure as gold (Ag).", "added": false, "viz": "bases:purine", "vf": false}, {"id": "c2_2", "sec": "RNA Structure", "kind   if(store.mode==="revisit") return shuffle(p.filter(c=>st(c.id).right)).sort((a,b)=>pct(a.id)-pct(b.id));
  if(store.mode==="cram") return shuffle(p.slice());
  p=p.filter(isDue);

  const empty = {due:"Nothing due. Switch to test prep.", cram:"No sections selected.", revisit:"Nothing to revisit yet."}[store.mode];
  app.innerHTML = `<a class="hub" href="../../">All decks</a><h1>Genetics Ch 13: Transcription</h1><p class="sub">RNA structure and classes, bacterial and eukaryotic transcription.</p>
  ${R?`<div class="resume"><div><b>Session paused</b><span>${R.ids.length} of ${R.total} cards left, ${MODES[R.mode][0].toLowerCase()}</span></div>
    <button class="go" id="resume">Resume</button><button class="link" id="discard">End it and see results</button></div>`:""}
  <div class="launch"><div class="due"><b>${startN}</b><span>${label}</span></div>
   <div class="modes">${Object.entries(MODES).map(([k,[n,d]])=>`<button class="mode" data-mode="${k}" aria-pressed="${store.mode===k}">${n}<small>${d}</small></button>`).join("")}</div>
   <button class="go${R?" alt":""}" id="go" ${startN?"":"disabled"}>${startN?(R?"Start a new session":"Start studying"):empty}</button></div>
  <div class="secs"><h2>Sections</h2>${SECS.map(s=>{const m=mastery(s);return `
   <button class="sec" style="--c:${cvar(s)}" data-sec="${s}" aria-pressed="${store.secs.includes(s)}">
    <span class="chk"></span><span class="secname">${s}</span><span class="secmeta">${m.m} of ${m.n} solid${m.p===null?"":` · ${m.p}% right`}</span>
    <span class="bar"><i style="width:${m.m/m.n*100}%;background:${cvar(s)}"></i><i style="width:${m.l/m.n*100}%;background:color-mix(in srgb,${cvar(s)} 35%,transparent)"></i></span>
   </button>`}).join("")}
   <div class="legend"><span style="--sw:var(--ink)">Solid: answered right 3 times running</span><span style="--sw:color-mix(in srgb,var(--ink) 35%,transparent)">Learning</span><span class="nosw">% right: share of all your grades that were Good or Easy</span></div></div>
  <div class="foot"><span>${CARDS.length} cards. Every grade saves on this device as you go.</span><button class="link" id="reset">Reset progress</button></div>`;
  app.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{store.mode=b.dataset.mode;save();home();});
  app.querySelectorAll(".sec").forEach(b=>b.onclick=()=>{const s=b.dataset.sec; store.secs=store.secs.includes(s)?store.secs.filter(x=>x!==s):store.secs.concat(s); save(); home();});
  document.getElementById("go").onclick=()=>{ if(R && !confirm("Start over? The paused session's grades are kept, but its remaining cards are dropped.")) return; start(buildQueue().map(c=>c.id), store.mode); };
  if(R){ document.getElementById("resume").onclick=()=>{ S=store.session; card(); };
    document.getElementById("discard").onclick=()=>{ S=store.session; finish(); }; }
  document.getElementById("reset").onclick=()=>{ if(confirm("Erase all progress on this device?")){store.cards={};store.session=null;save();home();} };
}
function start(ids, mode){ if(!ids.length) return;
  S = store.session = {ids, mode, total:ids.length, done:0, right:0, requeued:{}, first:{}}; save(); flipped=false; card(); }
function head(){ return `<div class="top"><button class="back" id="pause" title="Save your place and come back later">Pause</button>
  <div class="track"><i style="width:${S.done/S.total*100}%"></i></div><span class="count">${S.ids.length} left</span>
  <button class="back" id="end" title="Stop now and see your results">End</button></div>`; }
function card(){
  if(!S.ids.length) return finish();
  const c=BYID[S.ids[0]], f=flipped, p=pct(c.id), s=st(c.id);
  const frontViz = c.vf ? viz(c.viz, c.kind==="diagram"&&!f?{quiz:c.quiz,hideAll:true}:{}) : "";
  const backViz = f ? (c.kind==="diagram" ? viz(c.viz,{hl:c.quiz}) : (c.vizBack? viz(c.vizBack) : (c.vf?"":viz(c.viz)))) : "";
  app.innerHTML = head()+`<article class="card fadein" style="--c:${cvar(c.sec)}">
   <div class="chip"><span class="dot"></span>${c.sec}${c.added?'<span class="add">Beyond the slides</span>':""}
    <span class="score" title="Times you graded this card Good or Easy">${p===null?"New card":`${p}% right <small>(${s.right||0} of ${s.seen})</small>`}</span></div>
   <div class="prompt">${f&&c.kind==="cloze"?c.back:c.front}</div>
   ${(c.kind==="diagram"||c.vizBack)&&f?"":frontViz}
   ${f?`<div class="answer">${c.kind==="cloze"?"":`<div class="ans">${c.back}</div>`}${backViz}${c.extra?`<div class="extra">${c.extra}</div>`:""}</div>`:""}
   <div class="spacer"></div>
   ${f?`<div class="grades">${GRADES.map((n,k)=>`<button class="g" data-g="${k+1}" style="--gc:var(--${n.toLowerCase()})">${n}<small>${preview(c,k+1)}</small></button>`).join("")}</div>
     <div class="keys">Keys 1 to 4 to grade. Esc to pause.</div>`
   :`<button class="reveal" id="flip">Show answer</button><div class="keys">Space to show the answer. Esc to pause.</div>`}
  </article>`;
  document.getElementById("pause").onclick=home;
  document.getElementById("end").onclick=()=>{ if(confirm(`End the session now? Your ${S.done} graded card${S.done===1?"":"s"} are saved; the ${S.ids.length} left stay for next time.`)) finish(); };
  if(f) app.querySelectorAll(".g").forEach(b=>b.onclick=()=>answer(+b.dataset.g));
  else document.getElementById("flip").onclick=()=>{flipped=true;card();};
}
function answer(g){ const id=S.ids.shift(); grade(BYID[id],g); flipped=false;
  if(!(id in S.first)) S.first[id]=g;
  if(g===1){ S.ids.splice(Math.min(3,S.ids.length),0,id); }
  else if(g===2 && !S.requeued[id]){ S.requeued[id]=1; S.ids.splice(Math.min(8,S.ids.length),0,id); }
  else { S.done++; if(g>=3) S.right++; }
  if(S.done>S.total) S.total=S.done;
  save(); card(); }
function finish(){ const R=S, ids=Object.keys(R.first), n=ids.length, left=R.ids.filter(id=>!(id in R.first)).length;
  store.session=null; save(); S=null; flipped=false;
  const counts=[0,0,0,0], bySec={}; ids.forEach(id=>{ const g=R.first[id], sec=BYID[id]?.sec; counts[g-1]++;
    if(sec){ const b=bySec[sec]=bySec[sec]||{n:0,r:0}; b.n++; if(g>=3) b.r++; } });
  const known=n?Math.round((counts[2]+counts[3])/n*100):0, missed=ids.filter(id=>R.first[id]<=2&&BYID[id]);
  app.innerHTML=`<div class="done fadein"><h1>${R.ids.length?"Session ended":"Session complete"}</h1>
  <p class="sub">Saved on this device. ${left?`${left} card${left===1?"":"s"} not reached; they stay due for next time.`:""}</p>
  ${n?`<div class="result"><div class="big"><b>${known}%</b><span>right on the first try<br>${counts[2]+counts[3]} of ${n} cards</span></div>
   <div class="gbar">${counts.map((k,i)=>k?`<i style="flex:${k};background:var(--${GRADES[i].toLowerCase()})"></i>`:"").join("")}</div>
   <div class="glegend">${counts.map((k,i)=>`<span style="--sw:var(--${GRADES[i].toLowerCase()})">${GRADES[i]} ${k}</span>`).join("")}</div>
   <div class="bysec">${SECS.filter(s=>bySec[s]).map(s=>{const b=bySec[s],p=Math.round(b.r/b.n*100);return `
    <div class="bs" style="--c:${cvar(s)}"><span>${s}</span><span class="secmeta">${p}% · ${b.r} of ${b.n}</span><span class="bar"><i style="width:${p}%;background:var(--c)"></i></span></div>`}).join("")}</div></div>`
  :`<p>No cards graded this time.</p>`}
  ${missed.length?`<button class="go" id="miss">Practice the ${missed.length} I missed</button>`:""}
  <button class="go${missed.length?" alt":""}" id="h">Back to sections</button></div>`;
  document.getElementById("h").onclick=home;
  if(missed.length) document.getElementById("miss").onclick=()=>start(shuffle(missed), "cram");
}
document.addEventListener("keydown",e=>{ if(!S||!S.ids.length||e.metaKey||e.ctrlKey) return;
  if(e.key==="Escape"){ home(); return; }
  if(!flipped && (e.key===" "||e.key==="Enter")){ e.preventDefault(); flipped=true; card(); }
  else if(flipped && /^[1-4]$/.test(e.key)) answer(+e.key); });
home();
</script>
</body>
