<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
__TOKENS_CSS__
/* ---------- deck page: DESIGN.md section 10. Tokens only; no raw colors, sizes, radii or shadows. ---------- */
:root{ __SECVARS__ --deck-c:__DECK_C__; }
body{padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit}
svg text{font-family:var(--font-sans);font-weight:var(--fw-semibold);letter-spacing:-.01em}
/* home hero: band starts in the deck's first section color; darkened in dark mode so it doesn't glare */
.deckhero{--band-from:var(--deck-c);padding-top:max(var(--sp-6),env(safe-area-inset-top,0px))}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .deckhero{--band-from:color-mix(in oklch,var(--deck-c) 62%,var(--bg))} }
:root[data-theme="dark"] .deckhero{--band-from:color-mix(in oklch,var(--deck-c) 62%,var(--bg))}
.deckhero h1{margin-bottom:var(--sp-3)}
.deckhero .label{margin-bottom:var(--sp-2)}
.deckhero .lead{max-width:40ch;margin:0}
.toplinks{display:flex;gap:var(--sp-5);flex-wrap:wrap;margin:0 0 var(--sp-6)}
.overlap{position:relative;margin-top:calc(var(--band-height) * -.5);padding-bottom:var(--sp-8)}
.stack>*+*{margin-top:var(--sp-5)}
.card h2{font-size:var(--fs-h3);margin-bottom:var(--sp-1)}
.hint{color:var(--muted);font-size:var(--fs-small);margin:0 0 var(--sp-4)}
.resume{border-top:4px solid var(--accent)}
.center{display:flex;justify-content:center;margin-top:var(--sp-2)}
/* launch */
.due{display:flex;align-items:baseline;gap:var(--sp-3);flex-wrap:wrap}
.due b{font-size:var(--fs-h1);line-height:1;letter-spacing:var(--track-display);color:var(--ink);font-weight:var(--fw-bold)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2);margin:var(--sp-5) 0}
.mode{min-width:0;padding:var(--sp-3);border-radius:var(--r-md);border:1.5px solid var(--line-strong);background:var(--surface);text-align:start;line-height:var(--lh-heading);
  color:var(--ink);font-weight:var(--fw-semibold);font-size:var(--fs-small);cursor:pointer;transition:border-color var(--dur-fast) var(--ease-out),background var(--dur-fast) var(--ease-out)}
.mode small{display:block;color:var(--muted);font-weight:var(--fw-regular);font-size:var(--fs-caption);margin-top:var(--sp-1);line-height:1.4}
.mode:hover,.len:hover{border-color:var(--accent)}
.mode[aria-pressed="true"],.len[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-tint)}
/* quiz length and history */
.lens{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-2);margin:0 0 var(--sp-4)}
.len{min-height:44px;border-radius:var(--r-pill);border:1.5px solid var(--line-strong);background:var(--surface);font-weight:var(--fw-semibold);color:var(--ink);cursor:pointer}
.hist{margin:0 0 var(--sp-5)}
.histhead{display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp-3);flex-wrap:wrap;color:var(--muted);font-size:var(--fs-small)}
.histhead b{font-size:var(--fs-h3);color:var(--ink);margin-right:var(--sp-1)}
.hist svg{width:100%;height:auto;display:block;margin-top:var(--sp-2)}
.hist svg text{font-weight:var(--fw-medium)}
/* sections */
.secs{padding:var(--sp-2) var(--sp-5)}
.secs h2{margin:var(--sp-4) 0 var(--sp-2)}
.secrow{display:grid;grid-template-columns:22px 1fr auto;gap:var(--sp-1) var(--sp-3);align-items:center;width:100%;padding:var(--sp-3) 0;background:none;border:0;border-top:1px solid var(--line);text-align:start;cursor:pointer;color:var(--ink)}
.chk{width:22px;height:22px;border-radius:var(--r-sm);border:2px solid var(--c);display:grid;place-items:center}
.secrow[aria-pressed="true"] .chk{background:var(--c)}
.secrow[aria-pressed="true"] .chk::after{content:"";width:10px;height:5px;border:2.5px solid var(--surface);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.secname{font-weight:var(--fw-semibold)}
.secmeta{color:var(--muted);font-size:var(--fs-caption);white-space:nowrap}
.secrow .track,.bs .track{grid-column:2/4;display:flex}
.bs .track{grid-column:1/3}
.track>i+i{border-radius:0}
.legend{display:flex;gap:var(--sp-2) var(--sp-4);color:var(--muted);font-size:var(--fs-caption);flex-wrap:wrap;padding:var(--sp-3) 0 var(--sp-4);border-top:1px solid var(--line)}
.legend span::before,.glegend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:var(--r-xs);margin-right:var(--sp-1);vertical-align:-1px;background:var(--sw)}
.legend .nosw::before{display:none}
.foot{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);color:var(--muted);font-size:var(--fs-small)}
/* study mode: no band, no guides, one card */
.study{padding-top:max(var(--sp-4),env(safe-area-inset-top,0px));padding-bottom:var(--sp-7)}
.top{display:flex;align-items:center;gap:var(--sp-3)}
.top .track{flex:1}
.top .track>i{background:var(--accent)}
.count{color:var(--muted);font-size:var(--fs-small);white-space:nowrap}
.fc{--c:var(--ink);margin-top:var(--sp-4);min-height:360px;display:flex;flex-direction:column}
.chip{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.score{margin-left:auto;color:var(--muted);font-size:var(--fs-caption);font-weight:var(--fw-medium);white-space:nowrap}
.prompt{color:var(--ink);font-size:var(--fs-h3);font-weight:var(--fw-semibold);line-height:1.35;letter-spacing:-.015em;margin:var(--sp-4) 0 var(--sp-1)}
.list{display:inline-block;text-align:start}
.cz{color:var(--c);font-weight:var(--fw-bold)}
.cz.gap{display:inline-block;min-width:3.2em;padding:0 var(--sp-2);border-radius:var(--r-sm);background:color-mix(in srgb,var(--c) 12%,transparent);border-bottom:2.5px solid var(--c);text-align:center;font-weight:var(--fw-semibold)}
.viz{margin:var(--sp-3) 0 var(--sp-1)}
.viz svg{width:100%;height:auto;max-height:46vh;display:block}
.answer{border-top:1px solid var(--line);margin-top:var(--sp-4);padding-top:var(--sp-4)}
.ans{font-size:var(--fs-h3);line-height:1.35;font-weight:var(--fw-semibold);color:var(--c);letter-spacing:-.015em}
.extra{color:var(--text);font-size:var(--fs-small);margin-top:var(--sp-2)}
.spacer{flex:1}
.fc .btn{margin-top:var(--sp-5)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-2);margin-top:var(--sp-5)}
.g{min-height:56px;padding:var(--sp-2) var(--sp-1);border-radius:var(--r-md);border:0;background:var(--soft);border-bottom:3px solid var(--gc);color:var(--ink);font-weight:var(--fw-semibold);line-height:1.2;cursor:pointer;
  transition:transform var(--dur-fast) var(--ease-out)}
.g:active{transform:translateY(1px)}
.g small{display:block;font-weight:var(--fw-regular);color:var(--muted);font-size:var(--fs-caption);margin-top:2px}
.keys{color:var(--muted);font-size:var(--fs-caption);margin-top:var(--sp-3)}
@media (hover:none){.keys{display:none}}
/* quiz */
.opts{display:grid;gap:var(--sp-2);margin-top:var(--sp-4)}
.opt{display:flex;align-items:center;gap:var(--sp-3);width:100%;min-height:52px;padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);border:1.5px solid var(--line-strong);background:var(--surface);
  text-align:start;line-height:1.35;color:var(--ink);cursor:pointer;transition:border-color var(--dur-fast) var(--ease-out)}
.opt:not(:disabled):hover{border-color:var(--accent)}
.opt .ltr{flex:none;width:28px;height:28px;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--soft);font-weight:var(--fw-semibold);font-size:var(--fs-caption)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--easy);background:color-mix(in srgb,var(--easy) 12%,var(--surface))}
.opt.ok .ltr{background:var(--easy);color:var(--surface)}
.opt.bad{border-color:var(--again);background:color-mix(in srgb,var(--again) 12%,var(--surface))}
.opt.bad .ltr{background:var(--again);color:var(--surface)}
.opt.dim{opacity:.55}
.verdict{margin-top:var(--sp-4);font-weight:var(--fw-semibold)}
.verdict.ok{color:var(--easy)}.verdict.bad{color:var(--again)}
/* results */
.done h1{margin-top:var(--sp-5)}
.big{text-align:center;padding:var(--sp-2) 0 var(--sp-4)}
.big b{display:block;font-size:var(--fs-display);line-height:var(--lh-tight);letter-spacing:var(--track-display);color:var(--ink)}
.big span{color:var(--muted);font-size:var(--fs-small)}
.gbar{display:flex;gap:2px;height:10px;border-radius:var(--r-pill);overflow:hidden;margin:var(--sp-2) 0;background:var(--sunken)}
.glegend{display:flex;gap:var(--sp-2) var(--sp-4);flex-wrap:wrap;color:var(--muted);font-size:var(--fs-caption)}
.bysec{margin-top:var(--sp-4)}
.bs{display:grid;grid-template-columns:1fr auto;gap:var(--sp-1) var(--sp-3);padding:var(--sp-3) 0;border-top:1px solid var(--line);color:var(--ink);font-weight:var(--fw-medium)}
.mq{border-top:1px solid var(--line);border-left:4px solid var(--c);padding:var(--sp-3) 0 var(--sp-3) var(--sp-3);font-size:var(--fs-small);color:var(--text)}
.mq .ma{color:var(--c);font-weight:var(--fw-semibold);margin-top:2px}
@media (max-width:420px){.modes{gap:var(--sp-1)}.mode{padding:var(--sp-2)}.card{padding:var(--sp-4)}.secs{padding:var(--sp-1) var(--sp-4)}}
</style>
</head>
<body>
<div id="app"></div>
<script>

const DATA = __DATA__;
const CARDS = DATA.cards, P = DATA.paths;
const SECS = __SECS__;
const slug = s => s.toLowerCase().replace(/ /g,"-");
const cvar = s => `var(--s-${slug(s)})`;
const KEY = "studytime:__ID__";
const DAY = 864e5, INTERVALS = [0,1,2,4,7,14,30];
let store = {cards:{}, secs:SECS.slice(), mode:"due"};
try { const s = JSON.parse(localStorage.getItem(KEY)||"null"); if (s) store = Object.assign(store, s); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} };
const st = id => store.cards[id] || {box:0, due:0, seen:0};
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

/* ---------- diagrams ---------- */
let uid = 0;
function svgWrap(inner, h=340){ const id = "m"+(++uid);
  return `<svg viewBox="0 0 600 ${h}" role="img" aria-label="diagram"><defs>
  <marker id="${id}i" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--ink)"/></marker>
  <marker id="${id}a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--c)"/></marker>
  </defs>${inner.replace(/MK_I/g,`url(#${id}i)`).replace(/MK_A/g,`url(#${id}a)`)}</svg>`; }
const INK="var(--ink)", ACC="var(--c)", MUT="var(--muted)";
function label(x,y,t,o,anchor="middle"){
  const st = o.quiz===t ? "quiz" : (o.hideAll && o.quiz ? "blank" : (o.hl===t ? "hl":"show"));
  const w = Math.max(28, t.length*15.5+20), x0 = anchor==="middle"? x-w/2 : anchor==="start"? x-8 : x-w+8;
  if (st==="quiz") return `<rect x="${x-30}" y="${y-22}" width="60" height="40" rx="9" style="fill:var(--c)"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="30" style="fill:var(--surface)">?</text>`;
  if (st==="blank") return `<rect x="${x0}" y="${y-19}" width="${w}" height="34" rx="8" style="fill:var(--soft);stroke:var(--line)"/>`;
  return `<text x="${x}" y="${y+9}" text-anchor="${anchor}" font-size="${st==="hl"?29:26}" style="fill:${st==="hl"?ACC:INK}">${t}</text>`;
}
const ln = (x1,y1,x2,y2,c=INK,w=2,extra="") => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${c}" stroke-width="${w}" ${extra}/>`;
const arr = (x1,y1,x2,y2,on) => ln(x1,y1,x2,y2,on?ACC:INK,on?5:3.5,`marker-end="${on?"MK_A":"MK_I"}"`);
const D = __DIAGRAMS__;
function viz(spec, extra={}){ if(!spec) return ""; const [k,arg]=spec.split(":");
  const o = Object.assign({}, extra); if(arg && !o.quiz) o.hl=arg;
  return D[k] ? `<div class="viz">${D[k](o)}</div>` : ""; }

/* ---------- scheduling ---------- */
const BYID = Object.fromEntries(CARDS.map(c=>[c.id,c]));
const GRADES = ["Again","Hard","Good","Easy"];
function isDue(c){ const s=st(c.id); return s.due<=Date.now(); }
function pool(){ return CARDS.filter(c=>store.secs.includes(c.sec)); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
// Share of past grades that were Good or Easy; null if never studied.
function pct(id){ const s=st(id); return s.seen ? Math.round((s.right||0)/s.seen*100) : null; }
function buildQueue(){ let p = pool();
  if(store.mode==="revisit") return shuffle(p.filter(c=>st(c.id).right)).sort((a,b)=>pct(a.id)-pct(b.id));
  if(store.mode==="cram") return shuffle(p.slice());
  p=p.filter(isDue);
  // qm = missed on a quiz: always comes up next, even if never studied as a flashcard.
  const qm=p.filter(c=>st(c.id).qm), seen=p.filter(c=>st(c.id).seen&&!st(c.id).qm), fresh=p.filter(c=>!st(c.id).seen&&!st(c.id).qm);
  shuffle(qm); shuffle(seen); shuffle(fresh); return qm.concat(seen, fresh.slice(0,30)); }
function preview(c,g){ const s=st(c.id);
  if(g===1) return "again soon"; if(g===2) return "later this session";
  const b=Math.min(6,(s.box||0)+(g===3?1:2)); const d=INTERVALS[b]; return d===1?"1 day":d+" days"; }
function grade(c,g){ const s=Object.assign({},st(c.id)); s.seen=(s.seen||0)+1; if(g>=3) s.right=(s.right||0)+1; delete s.qm;
  if(g===1){ s.box=0; s.due=0; } else if(g===2){ s.box=Math.max(1,s.box||0); s.due=Date.now()+DAY*0.5; }
  else { s.box=Math.min(6,(s.box||0)+(g===3?1:2)); s.due=Date.now()+DAY*INTERVALS[s.box]-36e5; }
  store.cards[c.id]=s; save(); return s; }

/* ---------- views ---------- */
const app = document.getElementById("app");
// The session lives in store.session so it survives Pause, closing the tab, or a dead battery.
let S = null, Q = null, flipped = false;
if(store.session){ store.session.ids=store.session.ids.filter(id=>BYID[id]); if(!store.session.ids.length){ store.session=null; save(); } }
function mastery(sec){ const cs=CARDS.filter(c=>c.sec===sec); let m=0,l=0,seen=0,right=0;
  cs.forEach(c=>{const s=st(c.id), b=s.box||0; if(b>=3)m++; else if(s.seen)l++; seen+=s.seen||0; right+=s.right||0;});
  return {n:cs.length,m,l,p:seen?Math.round(right/seen*100):null}; }
const MODES = {due:["Daily study","Due cards plus up to 30 new"], cram:["Test prep","Every selected card, shuffled"],
  revisit:["Revisit","Cards you got right, lowest % first"]};
function home(){ S=null; Q=null; flipped=false;
  const startN = buildQueue().length, R = store.session;
  const label = {due:"cards ready to study", cram:"cards in this review", revisit:"cards to revisit"}[store.mode];
  const empty = {due:"Nothing due. Switch to test prep.", cram:"No sections selected.", revisit:"Nothing to revisit yet."}[store.mode];
  app.innerHTML = `<header class="hero guides deckhero"><div class="band" aria-hidden="true"></div><div class="reading">
    <nav class="toplinks"><a class="link quiet" href="../../">All decks</a>__GUIDELINK__</nav>
    <p class="label">__SUBJECT__</p><h1>__HEADING__</h1><p class="lead">__SUB__</p></div></header>
  <main class="reading overlap stack">
  ${R?`<div class="card float resume rise"><h2>Session paused</h2><p class="hint num">${R.ids.length} of ${R.total} cards left, ${MODES[R.mode][0].toLowerCase()}</p>
    <button class="btn block" id="resume">Resume</button><div class="center"><button class="link quiet" id="discard">End it and see results</button></div></div>`:""}
  <div class="card float rise"><div class="due"><b class="num">${startN}</b><span>${label}</span></div>
   <div class="modes">${Object.entries(MODES).map(([k,[n,d]])=>`<button class="mode" data-mode="${k}" aria-pressed="${store.mode===k}">${n}<small>${d}</small></button>`).join("")}</div>
   <button class="btn block${R?" ghost":""}" id="go" ${startN?"":"disabled"}>${startN?(R?"Start a new session":"Start studying"):empty}</button></div>
  ${quizPanel()}
  <div class="card secs"><h2>Sections</h2>${SECS.map(s=>{const m=mastery(s);return `
   <button class="secrow" style="--c:${cvar(s)}" data-sec="${s}" aria-pressed="${store.secs.includes(s)}">
    <span class="chk"></span><span class="secname">${s}</span><span class="secmeta num">${m.m} of ${m.n} solid${m.p===null?"":` · ${m.p}% right`}</span>
    <span class="track"><i style="width:${m.m/m.n*100}%"></i><i style="width:${m.l/m.n*100}%;background:color-mix(in srgb,var(--c) 35%,transparent)"></i></span>
   </button>`}).join("")}
   <div class="legend"><span style="--sw:var(--ink)">Solid: answered right 3 times running</span><span style="--sw:color-mix(in srgb,var(--ink) 35%,transparent)">Learning</span><span class="nosw">% right: share of all your grades that were Good or Easy</span></div></div>
  <div class="foot"><span>${CARDS.length} cards. Every grade saves on this device as you go.</span><button class="link quiet" id="reset">Reset progress</button></div></main>`;
  app.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{store.mode=b.dataset.mode;save();home();});
  app.querySelectorAll(".secrow").forEach(b=>b.onclick=()=>{const s=b.dataset.sec; store.secs=store.secs.includes(s)?store.secs.filter(x=>x!==s):store.secs.concat(s); save(); home();});
  document.getElementById("go").onclick=()=>{ if(R && !confirm("Start over? The paused session's grades are kept, but its remaining cards are dropped.")) return; start(buildQueue().map(c=>c.id), store.mode); };
  if(R){ document.getElementById("resume").onclick=()=>{ S=store.session; card(); };
    document.getElementById("discard").onclick=()=>{ S=store.session; finish(); }; }
  app.querySelectorAll(".len").forEach(b=>b.onclick=()=>{store.qlen=+b.dataset.len;save();home();});
  document.getElementById("quiz").onclick=()=>startQuiz(shuffle(pool().slice()).slice(0,(store.qlen===undefined?25:store.qlen)||Infinity).map(c=>c.id));
  document.getElementById("reset").onclick=()=>{ if(confirm("Erase all progress and quiz history on this device?")){store.cards={};store.session=null;store.quizzes=[];save();home();} };
}
function start(ids, mode){ if(!ids.length) return;
  S = store.session = {ids, mode, total:ids.length, done:0, right:0, requeued:{}, first:{}}; save(); flipped=false; card(); }
function head(){ return `<div class="top"><button class="link quiet" id="pause" title="Save your place and come back later">Pause</button>
  <div class="track"><i style="width:${S.done/S.total*100}%"></i></div><span class="count num">${S.ids.length} left</span>
  <button class="link quiet" id="end" title="Stop now and see your results">End</button></div>`; }
function card(){
  if(!S.ids.length) return finish();
  const c=BYID[S.ids[0]], f=flipped, p=pct(c.id), s=st(c.id);
  const frontViz = c.vf ? viz(c.viz, c.kind==="diagram"&&!f?{quiz:c.quiz,hideAll:true}:{}) : "";
  const backViz = f ? (c.kind==="diagram" ? viz(c.viz,{hl:c.quiz}) : (c.vizBack? viz(c.vizBack) : (c.vf?"":viz(c.viz)))) : "";
  app.innerHTML = `<main class="reading study">`+head()+`<article class="card float accent fc rise" style="--c:${cvar(c.sec)}">
   <div class="chip"><span class="tag sec">${c.sec}</span>${c.added?'<span class="tag">Beyond the slides</span>':""}
    <span class="score num" title="Times you graded this card Good or Easy">${p===null?"New card":`${p}% right (${s.right||0} of ${s.seen})`}</span></div>
   <div class="prompt">${f&&c.kind==="cloze"?c.back:c.front}</div>
   ${(c.kind==="diagram"||c.vizBack)&&f?"":frontViz}
   ${f?`<div class="answer">${c.kind==="cloze"?"":`<div class="ans">${c.back}</div>`}${backViz}${c.extra?`<div class="extra">${c.extra}</div>`:""}</div>`:""}
   <div class="spacer"></div>
   ${f?`<div class="grades">${GRADES.map((n,k)=>`<button class="g" data-g="${k+1}" style="--gc:var(--${n.toLowerCase()})">${n}<small>${preview(c,k+1)}</small></button>`).join("")}</div>
     <div class="keys">Keys 1 to 4 to grade. Esc to pause.</div>`
   :`<button class="btn dark block no-chev" id="flip">Show answer</button><div class="keys">Space to show the answer. Esc to pause.</div>`}
  </article></main>`;
  document.getElementById("pause").onclick=home;
  document.getElementById("end").onclick=()=>{ if(confirm(`End the session now? Your ${S.done} graded card${S.done===1?"":"s"} are saved; the ${S.ids.length} left stay for next time.`)) finish(); };
  if(f) app.querySelectorAll(".g").forEach(b=>b.onclick=()=>answer(+b.dataset.g));
  else document.getElementById("flip").onclick=()=>{flipped=true;card();};
}
function answer(g){ const id=S.ids.shift(); grade(BYID[id],g); flipped=false;
  if(!(id in S.first)) S.first[id]=g;
  if(g===1){ S.ids.splice(Math.min(3,S.ids.length),0,id); }
  else if(g===2 && !S.requeued[id]){ S.requeued[id]=1; S.ids.splice(Math.min(8,S.ids.length),0,id); }
  else { S.done++; if(g>=3) S.right++; }
  if(S.done>S.total) S.total=S.done;
  save(); card(); }
function finish(){ const R=S, ids=Object.keys(R.first), n=ids.length, left=R.ids.filter(id=>!(id in R.first)).length;
  store.session=null; save(); S=null; flipped=false;
  const counts=[0,0,0,0], bySec={}; ids.forEach(id=>{ const g=R.first[id], sec=BYID[id]?.sec; counts[g-1]++;
    if(sec){ const b=bySec[sec]=bySec[sec]||{n:0,r:0}; b.n++; if(g>=3) b.r++; } });
  const known=n?Math.round((counts[2]+counts[3])/n*100):0, missed=ids.filter(id=>R.first[id]<=2&&BYID[id]);
  app.innerHTML=`<main class="reading study done rise"><h1>${R.ids.length?"Session ended":"Session complete"}</h1>
  <p class="hint">Saved on this device. ${left?`${left} card${left===1?"":"s"} not reached; they stay due for next time.`:""}</p>
  ${n?`<div class="card"><div class="big"><b class="num">${known}%</b><span class="num">right on the first try, ${counts[2]+counts[3]} of ${n} cards</span></div>
   <div class="gbar">${counts.map((k,i)=>k?`<i style="flex:${k};background:var(--${GRADES[i].toLowerCase()})"></i>`:"").join("")}</div>
   <div class="glegend">${counts.map((k,i)=>`<span style="--sw:var(--${GRADES[i].toLowerCase()})">${GRADES[i]} ${k}</span>`).join("")}</div>
   <div class="bysec">${SECS.filter(s=>bySec[s]).map(s=>{const b=bySec[s],p=Math.round(b.r/b.n*100);return `
    <div class="bs" style="--c:${cvar(s)}"><span>${s}</span><span class="secmeta num">${p}% · ${b.r} of ${b.n}</span><span class="track"><i style="width:${p}%"></i></span></div>`}).join("")}</div></div>`
  :`<p>No cards graded this time.</p>`}
  <div class="stack" style="margin-top:var(--sp-5)">${missed.length?`<button class="btn block" id="miss">Practice the ${missed.length} I missed</button>`:""}
  <button class="btn block${missed.length?" ghost":""}" id="h">Back to sections</button></div></main>`;
  document.getElementById("h").onclick=home;
  if(missed.length) document.getElementById("miss").onclick=()=>start(shuffle(missed), "cram");
}
/* ---------- quiz ---------- */
// Multiple choice built from the cards. Kept apart from flashcard levels and % right;
// the only link back is that missed questions come up first in the next Daily study.
const plain = h => h.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
const answerOf = c => { if(c.kind!=="cloze") return c.back; const m=c.back.match(/<span class="cz">(.*?)<\/span>/); return m?m[1]:c.back; };
const family = c => c.kind==="cloze" ? c.id.split("_")[0] : c.kind==="diagram" ? c.viz.split(":")[0] : null;
function choices(c){
  const right=answerOf(c), key=a=>plain(a).toLowerCase(), used=new Set([key(right)]), out=[], shown=plain(c.front).toLowerCase();
  // Skip any choice already visible in the question (the rest of a list, or a word the prompt itself uses).
  const take=list=>{ for(const a of list){ if(out.length>=3) break; const k=key(a); if(k&&!used.has(k)&&!shown.includes(k)){ used.add(k); out.push(a); } } };
  // Siblings first: the other gaps of the same list, or the other labels of the same diagram.
  const fam=family(c); if(fam) take(shuffle(CARDS.filter(x=>x!==c&&family(x)===fam).map(answerOf)));
  // Then lookalikes: same card kind, similar length, numbers with numbers, same section preferred.
  const sh=a=>{const p=plain(a); return {w:p.split(" ").length, n:/\d/.test(p)};}, r=sh(right);
  take(CARDS.filter(x=>x!==c&&x.kind===c.kind).map(x=>{const a=answerOf(x), s=sh(a);
    return [a, Math.abs(s.w-r.w)*1.5+(s.n!==r.n?6:0)+(x.sec!==c.sec?2.5:0)+Math.random()*2];}).sort((a,b)=>a[1]-b[1]).map(x=>x[0]));
  const opts=shuffle(out.concat([right])); return {id:c.id, opts, ans:opts.indexOf(right)}; }
function startQuiz(ids){ if(!ids.length) return; S=null; Q={qs:ids.map(id=>choices(BYID[id])), i:0, picks:[]}; renderQ(); }
const LENS=[10,25,50,0];
function quizPanel(){ const n=pool().length, len=store.qlen===undefined?25:store.qlen, take=len?Math.min(len,n):n, H=store.quizzes||[];
  return `<div class="card"><h2>Quiz</h2><p class="hint">Multiple choice from the selected sections. Scores are kept separate from your flashcards.</p>
   ${H.length?scoreChart(H):""}
   <div class="lens" role="group" aria-label="Quiz length">${LENS.map(l=>`<button class="len" data-len="${l}" aria-pressed="${len===l}">${l||"All"}</button>`).join("")}</div>
   <button class="btn dark block" id="quiz" ${n?"":"disabled"}>${n?`Start a ${take}-question quiz`:"No sections selected."}</button></div>`; }
function scoreChart(H){ const h=H.slice(-12), last=h[h.length-1], best=Math.max(...H.map(q=>Math.round(q.r/q.n*100)));
  const W=600, T=160, L=78, R=30, top=20, bot=20, X=i=>h.length<2?(L+W-R)/2:L+i*(W-L-R)/(h.length-1), Y=p=>top+(100-p)*(T-top-bot)/100;
  const pts=h.map((q,i)=>({x:X(i),y:Y(Math.round(q.r/q.n*100)),p:Math.round(q.r/q.n*100),q}));
  const day=t=>new Date(t).toLocaleDateString(undefined,{month:"short",day:"numeric"});
  return `<div class="hist"><div class="histhead"><span><b class="num">${pts[pts.length-1].p}%</b> last quiz</span><span class="num">Best ${best}% · ${H.length} quiz${H.length===1?"":"zes"} taken</span></div>
   <svg viewBox="0 0 ${W} ${T}" role="img" aria-label="Quiz scores, oldest to newest: ${pts.map(t=>t.p+"%").join(", ")}">
   ${[0,50,100].map(v=>`<line x1="${L}" x2="${W-R+10}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)" vector-effect="non-scaling-stroke" stroke-width="1"/><text x="${L-10}" y="${Y(v)+7}" text-anchor="end" font-size="24" style="fill:var(--muted)">${v}%</text>`).join("")}
   ${pts.length>1?`<polyline points="${pts.map(t=>t.x+","+t.y).join(" ")}" fill="none" style="stroke:var(--sky-ink)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`:""}
   ${pts.map(t=>`<g class="pt"><title>${day(t.q.t)}: ${t.p}% (${t.q.r} of ${t.q.n})</title><circle cx="${t.x}" cy="${t.y}" r="22" fill="transparent"/>
     <circle cx="${t.x}" cy="${t.y}" r="8" style="fill:var(--sky-ink);stroke:var(--surface)" stroke-width="3"/></g>`).join("")}
   </svg></div>`; }
function qhead(){ return `<div class="top"><button class="link quiet" id="qend">End</button><div class="track"><i style="width:${Q.picks.length/Q.qs.length*100}%"></i></div><span class="count num">${Math.min(Q.i+1,Q.qs.length)} of ${Q.qs.length}</span></div>`; }
function renderQ(){ const q=Q.qs[Q.i], c=BYID[q.id], k=Q.picks[Q.i], done=k!==undefined;
  const v = c.kind==="diagram" ? viz(c.viz, done?{hl:c.quiz}:{quiz:c.quiz,hideAll:true}) : (c.vf||done ? viz(c.viz) : "");
  app.innerHTML = `<main class="reading study">`+qhead()+`<article class="card float accent fc rise" style="--c:${cvar(c.sec)}">
   <div class="chip"><span class="tag sec">${c.sec}</span></div>
   <div class="prompt">${done&&c.kind==="cloze"?c.back:c.front}</div>${v}
   <div class="opts">${q.opts.map((o,i)=>`<button class="opt${done?(i===q.ans?" ok":i===k?" bad":" dim"):""}" data-k="${i}" ${done?"disabled":""}>
     <span class="ltr">${done&&i===q.ans?"✓":done&&i===k?"✗":"ABCD"[i]}</span><span>${o}</span></button>`).join("")}</div>
   ${done?`<div class="verdict ${k===q.ans?"ok":"bad"}">${k===q.ans?"Correct":"Not quite"}</div>${c.extra?`<div class="extra">${c.extra}</div>`:""}`:""}
   <div class="spacer"></div>
   ${done?`<button class="btn dark block" id="next">${Q.i+1<Q.qs.length?"Next question":"See results"}</button><div class="keys">Space for next</div>`
     :`<div class="keys">Keys 1 to 4 or A to D to answer</div>`}</article></main>`;
  document.getElementById("qend").onclick=()=>{ if(!Q.picks.length) return home(); if(confirm(`End the quiz now? You'll be scored on the ${Q.picks.length} you answered.`)) quizResults(); };
  if(done) document.getElementById("next").onclick=nextQ;
  else app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k)); }
function pick(k){ Q.picks[Q.i]=k; renderQ(); }
function nextQ(){ Q.i++; Q.i<Q.qs.length ? renderQ() : quizResults(); }
function quizResults(){ const done=Q.qs.filter((q,i)=>Q.picks[i]!==undefined), n=done.length;
  const missed=done.filter(q=>Q.picks[Q.qs.indexOf(q)]!==q.ans), r=n-missed.length, p=n?Math.round(r/n*100):0, bySec={};
  done.forEach(q=>{const s=BYID[q.id].sec, b=bySec[s]=bySec[s]||{n:0,r:0}; b.n++; if(Q.picks[Q.qs.indexOf(q)]===q.ans) b.r++;});
  if(n){ store.quizzes=(store.quizzes||[]).concat({t:Date.now(),n,r}).slice(-50);
    missed.forEach(q=>{ store.cards[q.id]=Object.assign({},st(q.id),{due:0,qm:1}); }); save(); }
  const ids=missed.map(q=>q.id), all=Q.qs.length; Q=null;
  app.innerHTML=`<main class="reading study done rise"><h1>Quiz ${n<all?"ended":"complete"}</h1>
  ${n?`<div class="card"><div class="big"><b class="num">${p}%</b><span class="num">${r} of ${n} correct</span></div>
   <div class="bysec">${SECS.filter(s=>bySec[s]).map(s=>{const b=bySec[s],sp=Math.round(b.r/b.n*100);return `
    <div class="bs" style="--c:${cvar(s)}"><span>${s}</span><span class="secmeta num">${sp}% · ${b.r} of ${b.n}</span><span class="track"><i style="width:${sp}%"></i></span></div>`}).join("")}</div></div>
   ${missed.length?`<div class="card" style="margin-top:var(--sp-5)"><h2>Missed</h2><p class="hint">These come up first in your next Daily study.</p>${missed.map(q=>{const c=BYID[q.id];return `
    <div class="mq" style="--c:${cvar(c.sec)}"><div>${c.kind==="diagram"?`${plain(c.front)}`:c.front}</div><div class="ma">${answerOf(c)}</div></div>`}).join("")}</div>`:""}`
  :`<p>No questions answered.</p>`}
  <div class="stack" style="margin-top:var(--sp-5)">${missed.length?`<button class="btn block" id="retake">Retake the ${missed.length} I missed</button>`:""}
  <button class="btn block${missed.length?" ghost":""}" id="h">Back to the deck</button></div></main>`;
  document.getElementById("h").onclick=home;
  if(missed.length) document.getElementById("retake").onclick=()=>startQuiz(shuffle(ids)); }

document.addEventListener("keydown",e=>{ if(e.metaKey||e.ctrlKey) return;
  if(Q){ const q=Q.qs[Q.i]; if(!q) return;
    if(Q.picks[Q.i]===undefined){ const k=e.key.length===1?Math.max("1234".indexOf(e.key),"abcd".indexOf(e.key.toLowerCase())):-1; if(k>=0&&k<q.opts.length) pick(k); }
    else if(e.key===" "||e.key==="Enter"){ e.preventDefault(); nextQ(); }
    return; }
  if(!S||!S.ids.length) return;
  if(e.key==="Escape"){ home(); return; }
  if(!flipped && (e.key===" "||e.key==="Enter")){ e.preventDefault(); flipped=true; card(); }
  else if(flipped && /^[1-4]$/.test(e.key)) answer(+e.key); });
home();
</script>
</body>
