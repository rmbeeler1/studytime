<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__ Study Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
__TOKENS_CSS__
/* ---------- study guide: DESIGN.md section 11. Tokens only; no raw colors, sizes, radii or shadows. ---------- */
__SECVARS__
html{scroll-padding-top:var(--sp-4);scroll-behavior:smooth}
svg text{font-family:var(--font-sans);font-weight:var(--fw-semibold);letter-spacing:-.01em}
.deckhero{--band-from:var(--deck-c);padding-top:max(var(--sp-6),env(safe-area-inset-top,0px))}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .deckhero{--band-from:color-mix(in oklch,var(--deck-c) 62%,var(--bg))} }
:root[data-theme="dark"] .deckhero{--band-from:color-mix(in oklch,var(--deck-c) 62%,var(--bg))}
.deckhero h1{margin-bottom:var(--sp-3)}
.deckhero .label{margin-bottom:var(--sp-2)}
.deckhero .lead{max-width:40ch;margin:0}
.toplinks{display:flex;gap:var(--sp-5);flex-wrap:wrap;margin:0 0 var(--sp-6)}
.overlap{position:relative;margin-top:calc(var(--band-height) * -.5);padding-bottom:var(--sp-8)}
.toc h2{font-size:var(--fs-h3);margin-bottom:var(--sp-3)}
.toc ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-1) var(--sp-5)}
.toc a{display:flex;align-items:center;gap:var(--sp-2);color:var(--ink);text-decoration:none;font-weight:var(--fw-medium);padding:var(--sp-1) 0;line-height:1.35}
.toc a:hover{color:var(--accent)}
.toc a::before{content:"";width:10px;height:10px;border-radius:var(--r-xs);background:var(--c);flex:none}
.tocfoot{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);margin-top:var(--sp-4);padding-top:var(--sp-3);border-top:1px solid var(--line)}
section.card{margin-top:var(--sp-6)}
section>h2{display:flex;align-items:baseline;gap:var(--sp-3);margin:var(--sp-2) 0 var(--sp-3)}
section>h2 .n{color:var(--c)}
h3{color:var(--ink);margin:var(--sp-6) 0 var(--sp-2)}
section p,section li{max-width:var(--reading-max)}
ul,ol{padding-left:1.3em;margin:0 0 1em}
li{margin:var(--sp-1) 0}
b,strong{font-weight:var(--fw-semibold);color:var(--ink)}
.term{font-weight:var(--fw-semibold);color:var(--c)}
.tablewrap{overflow-x:auto;margin:var(--sp-3) 0 var(--sp-4)}
table{width:100%;border-collapse:collapse;font-size:var(--fs-small)}
th,td{text-align:start;padding:var(--sp-2) var(--sp-3) var(--sp-2) 0;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:var(--fw-semibold)}
td{color:var(--text)}
.viz{margin:var(--sp-4) 0 var(--sp-2)}
.viz svg{width:100%;height:auto;max-height:420px;display:block}
figure{margin:var(--sp-4) 0}
figcaption{color:var(--muted);font-size:var(--fs-caption)}
.box{--bar:var(--c);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);margin:var(--sp-4) 0;background:color-mix(in srgb,var(--bar) 9%,var(--surface));border-left:4px solid var(--bar)}
.box.warn{--bar:var(--again)}
.box>.lbl{display:block;font-weight:var(--fw-bold);color:var(--bar);margin-bottom:var(--sp-1)}
details.check{border:1.5px solid var(--line-strong);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);margin:var(--sp-3) 0}
details.check summary{cursor:pointer;list-style:none;color:var(--ink);font-weight:var(--fw-semibold)}
details.check summary::-webkit-details-marker{display:none}
details.check summary .link{padding:0 0 var(--sp-1)}
details.check summary .link::after{transition:transform var(--dur-fast) var(--ease-out)}
details.check[open] summary .link::after{transform:rotate(90deg)}
details.check .a{margin-top:var(--sp-3);padding-top:var(--sp-3);border-top:1px solid var(--line);color:var(--text)}
.math{font-family:var(--font-mono);font-size:.92em;background:var(--sunken);padding:1px var(--sp-1);border-radius:var(--r-xs);color:var(--ink)}
.backtop{display:flex;justify-content:flex-end;margin-top:var(--sp-3)}
.end{margin-top:var(--sp-7)}
.end h2{font-size:var(--fs-h3)}
@media (max-width:520px){.toc ol{grid-template-columns:1fr}}
@media (max-width:420px){.card{padding:var(--sp-4)}}
@media print{
  :root{--bg:var(--surface)}
  .band,.toplinks,.tocfoot,.backtop,.end{display:none!important}
  .guides::before{display:none}
  .hero{padding-block:0 var(--sp-4)}
  .overlap{margin-top:0;padding-bottom:0}
  .card{box-shadow:none}
  section.card{break-inside:auto}
  figure,.box,table,details{break-inside:avoid}
  details.check summary .link::after{display:none}
}
</style>
</head>
<body>
<header class="hero guides deckhero"><div class="band" aria-hidden="true"></div><div class="reading">
  <nav class="toplinks"><a class="link quiet" href="../../">Back to all decks</a><a class="link" href="./">Study the flashcards</a></nav>
  <p class="label">__SUBJECT__ study guide</p><h1>__HEADING__</h1><p class="lead">__SUB__</p></div></header>
<main class="reading overlap">
<nav class="card float toc" id="toc" aria-label="Sections"><h2>Contents</h2><ol id="toclist"></ol>
  <div class="tocfoot"><span class="hint">Every fact here is also a flashcard.</span><button class="btn ghost sm no-chev" onclick="document.querySelectorAll('details').forEach(d=>d.open=true);print()">Print</button></div></nav>
__BODY__
<div class="card end"><h2>Done reading?</h2><p>Test what stuck with the flashcards and the quiz.</p><a class="btn block" href="./">Open flashcards and quiz</a></div>
</main>
<script>
const P = __PATHS__;
__DIAGRAM_CODE__
const slug = s => s.toLowerCase().replace(/ /g,"-");
document.querySelectorAll("section[data-sec]").forEach((s,i)=>{
  const name=s.dataset.sec, c=`var(--s-${slug(name)})`; s.id=slug(name); s.classList.add("card","accent"); s.style.setProperty("--c",c);
  const h=s.querySelector("h2"); if(h) h.insertAdjacentHTML("afterbegin",`<span class="n num">${i+1}</span>`);
  s.insertAdjacentHTML("beforeend",'<div class="backtop"><a class="link quiet" href="#toc">Back to contents</a></div>');
  document.getElementById("toclist").insertAdjacentHTML("beforeend",`<li><a href="#${s.id}" style="--c:${c}">${name}</a></li>`);
});
document.querySelectorAll("details.check summary").forEach(s=>{ s.innerHTML=`<span class="link">Check yourself</span><span>${s.innerHTML}</span>`; s.style.display="grid"; });
document.querySelectorAll("[data-viz]").forEach(el=>{ el.outerHTML = viz(el.dataset.viz) || ""; });
</script>
</body>
</html>
