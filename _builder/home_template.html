<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
__TOKENS_CSS__
/* ---------- home page: DESIGN.md section 12. Tokens only; no raw colors, sizes, radii or shadows. ---------- */
.hero{padding-top:max(var(--sp-9),env(safe-area-inset-top,0px))}
@media (max-width:639px){ .hero{padding-top:max(var(--sp-7),env(safe-area-inset-top,0px))} }
/* No overlap here: subject headings are text, and text never sits on the band. */
.list{position:relative;padding-top:var(--sp-6);padding-bottom:var(--sp-9)}
.subject+.subject{margin-top:var(--sp-7)}
.subject>h2{margin-bottom:var(--sp-4)}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:var(--sp-5)}
.deck{display:grid;grid-template-columns:auto 1fr auto;gap:var(--sp-1) var(--sp-3);align-items:baseline}
.deck .cover{position:static;color:inherit;text-decoration:none}
.deck .cover::after{content:"";position:absolute;inset:0;border-radius:inherit}
.deck .cover:focus-visible{box-shadow:none}
.deck:has(.cover:focus-visible){box-shadow:var(--focus-ring),var(--shadow-lg)}
.deck .n{color:var(--c);font-weight:var(--fw-bold)}
.deck .topic{color:var(--ink);font-weight:var(--fw-semibold);font-size:var(--fs-h3);line-height:var(--lh-heading);letter-spacing:var(--track-heading)}
.deck .pct{grid-row:1/3;grid-column:3;text-align:end;color:var(--ink);font-weight:var(--fw-bold);font-size:var(--fs-h3);line-height:1.1}
.deck .pct small{display:block;color:var(--muted);font-weight:var(--fw-medium);font-size:var(--fs-caption)}
.deck .meta{grid-column:2;color:var(--muted);font-size:var(--fs-small)}
.deck .track{grid-column:1/4;margin-top:var(--sp-3)}
.deck .foot{grid-column:1/4;display:flex;justify-content:flex-end;margin-top:var(--sp-2);min-height:var(--sp-2)}
.deck .foot .link{position:relative;z-index:1}
.empty{color:var(--muted)}
</style>
</head>
<body>
<header class="hero guides"><div class="band" aria-hidden="true"></div><div class="container">
  <p class="label">Study Time</p>
  <h1 class="display">Pick up where you left off.</h1>
  <p class="lead">Flashcards, quizzes and study guides for every unit. Progress saves on this device.</p>
</div></header>
<main class="container list guides" id="list"><p class="empty">Loading decks…</p></main>
<script>
function solid(id){
  try{ const s=JSON.parse(localStorage.getItem("studytime:"+id)||"null"); if(!s||!s.cards) return 0;
    return Object.values(s.cards).filter(c=>(c.box||0)>=3).length; }catch(e){ return 0; }
}
fetch("decks.json",{cache:"no-store"}).then(r=>r.json()).then(decks=>{
  const by={}; decks.forEach(d=>(by[d.subject]=by[d.subject]||[]).push(d));
  // ?v= changes whenever a page is rebuilt, so phones never show a stale copy after an update.
  const v=x=>x?`?v=${x}`:"";
  const html=Object.keys(by).sort().map(sub=>`<section class="subject"><h2>${sub}</h2><div class="decks">`+by[sub]
    .sort((a,b)=>a.path.localeCompare(b.path))
    .map(d=>{const p=Math.round(solid(d.id)/d.cards*100);
      return `<article class="card lift deck" style="--c:var(--${d.accent||"sec-blue"})">
       <span class="n num">${d.number}</span><a class="cover topic" href="${d.path}${v(d.v)}">${d.topic}</a>
       <span class="pct num">${p}%<small>solid</small></span><span class="meta num">${d.cards} cards</span>
       <span class="track"><i style="width:${p}%"></i></span>
       <span class="foot">${d.guide?`<a class="link" href="${d.path}${d.guide}${v(d.gv)}">Guide</a>`:""}</span></article>`}).join("")+`</div></section>`).join("");
  document.getElementById("list").innerHTML=html||'<p class="empty">No decks yet.</p>';
}).catch(()=>{document.getElementById("list").innerHTML='<p class="empty">Could not load the deck list. Open this page from its GitHub Pages link, not as a downloaded file.</p>';});
</script>
</body>
</html>
