<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef2;--surface:#fff;--ink:#15222c;--muted:#56656f;--line:#c9d3da;--soft:#dfe6eb;--acc:#1d5fa8;color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a22;--surface:#172530;--ink:#e4ebf0;--muted:#9aabb7;--line:#2c3d4a;--soft:#22323e;--acc:#7fb2ec;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a22;--surface:#172530;--ink:#e4ebf0;--muted:#9aabb7;--line:#2c3d4a;--soft:#22323e;--acc:#7fb2ec;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",-apple-system,"Segoe UI",Roboto,sans-serif;font-size:19px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 48px}
h1{font-family:"Barlow Condensed","Barlow",sans-serif;font-size:2.6rem;line-height:1;margin:.3em 0 .15em}
h2{font-family:"Barlow Condensed","Barlow",sans-serif;font-size:1.5rem;margin:1.4em 0 .4em}
.sub{color:var(--muted);margin:0}
a.deck{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;text-decoration:none;color:inherit;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
a.deck:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.num{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.05rem;color:var(--acc);grid-row:1/3}
.topic{font-weight:600;font-size:1.1em}
.meta{color:var(--muted);font-size:.8em;grid-column:2/3}
.pct{grid-row:1/3;grid-column:3;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.3rem;text-align:end;line-height:1.1}
.pct small{display:block;font-family:"Barlow",sans-serif;font-weight:400;font-size:.6rem;color:var(--muted)}
.bar{grid-column:1/4;height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc)}
.empty{color:var(--muted)}
.item{margin-bottom:10px}
.item a.deck{margin-bottom:0}
.item.has-guide a.deck{border-radius:16px 16px 0 0}
a.guide{display:flex;align-items:center;justify-content:space-between;gap:10px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 16px 16px;padding:10px 16px;font-size:.9em;font-weight:500}
a.guide span{color:var(--muted);font-weight:400;font-size:.9em}
a.guide:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Study Time</h1>
  <p class="sub">Pick a deck. Progress saves on this device.</p>
  <div id="list"><p class="empty">Loading decks…</p></div>
</div>
<script>
function solid(id){
  try{ const s=JSON.parse(localStorage.getItem("studytime:"+id)||"null"); if(!s||!s.cards) return 0;
    return Object.values(s.cards).filter(c=>(c.box||0)>=3).length; }catch(e){ return 0; }
}
fetch("decks.json",{cache:"no-store"}).then(r=>r.json()).then(decks=>{
  const by={}; decks.forEach(d=>(by[d.subject]=by[d.subject]||[]).push(d));
  const html=Object.keys(by).sort().map(sub=>`<h2>${sub}</h2>`+by[sub]
    .sort((a,b)=>a.path.localeCompare(b.path))
    .map(d=>{const n=solid(d.id), p=Math.round(n/d.cards*100);
      // ?v= changes whenever a page is rebuilt, so phones never show a stale copy after an update.
      const v=x=>x?`?v=${x}`:"";
      return `<div class="item${d.guide?" has-guide":""}"><a class="deck" href="${d.path}${v(d.v)}"><span class="num">${d.number}</span><span class="topic">${d.topic}</span>
      <span class="meta">${d.cards} cards</span><span class="pct">${p}%<small>solid</small></span>
      <span class="bar"><i style="width:${p}%"></i></span></a>
      ${d.guide?`<a class="guide" href="${d.path}${d.guide}${v(d.gv)}">Study guide <span>Read the notes</span></a>`:""}</div>`}).join("")).join("");
  document.getElementById("list").innerHTML=html||'<p class="empty">No decks yet.</p>';
}).catch(()=>{document.getElementById("list").innerHTML='<p class="empty">Could not load the deck list. Open this page from its GitHub Pages link, not as a downloaded file.</p>';});
</script>
</body>
</html>
